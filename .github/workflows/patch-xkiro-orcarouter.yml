name: Patch xKiro and OrcaRouter providers

on:
  push:
    branches:
      - fix/adult-vision-person-labels

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provider patch
        run: python3 tools/patch_xkiro_orcarouter.py
      - name: Commit provider integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt \
                  app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt \
                  app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt \
                  app/src/main/java/com/riyan/aikeyboard/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No provider changes"
            exit 0
          fi
          git commit -m "Add xKiro and OrcaRouter providers"
          git push origin HEAD:fix/adult-vision-person-labels
