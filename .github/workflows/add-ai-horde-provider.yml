name: Add AI Horde provider

on:
  push:
    branches:
      - fix/short-vision-query-search-engine-natural-adult
    paths:
      - tools/apply_ai_horde_provider.py
      - .github/workflows/add-ai-horde-provider.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-vision-query-search-engine-natural-adult
          fetch-depth: 0
      - name: Apply AI Horde integration
        run: python3 tools/apply_ai_horde_provider.py
      - name: Commit provider integration
        run: |
          if git diff --quiet; then
            echo "AI Horde provider already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt \
                  app/src/main/java/com/riyan/aikeyboard/MainActivity.kt \
                  app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt \
                  app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          git commit -m "Add AI Horde free text provider"
          git push origin HEAD:fix/short-vision-query-search-engine-natural-adult
