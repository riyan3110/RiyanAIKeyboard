name: Patch All Vision v0.21.11

on:
  push:
    branches: [ fix/vision-query-pan-zoom ]
    paths:
      - '.github/workflows/patch-all-vision-v02111.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-query-pan-zoom
          fetch-depth: 0

      - name: Patch shared Vision rules for every provider
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Shared multimodal-provider contract + rejection gate.
          p = Path('app/smart-vision.gradle.kts')
          s = p.read_text()

          new_rule = r'''        val newHumanRule = "Untuk subject_type person atau human_figure, field query WAJIB berupa detailed English visual-search prompt yang natural, spesifik, dan deskriptif: idealnya 14–32 kata dan maksimal sekitar 320 karakter. Untuk manusia yang jelas dewasa, gunakan adult woman atau adult man. Jangan berhenti pada kalimat generik seperti adult woman sexy wearing shorts. Jelaskan sebanyak mungkin ciri yang BENAR-BENAR terlihat: front/rear/side view, pose, hair length/color/texture, upper garment dan lower garment secara terpisah, warna, material/fabric, tight/fitted/bodycon/loose fit, neckline, straps/sleeves, accessories, serta scene/background. Jika styling orang dewasa jelas sensual, revealing, atau body-emphasizing, deskripsi WAJIB menyebut detail dewasa yang benar-benar terlihat secara langsung dan tidak disamarkan, misalnya sexy, sensual, visible cleavage, prominent/full bust, defined waist, curvy hips, prominent buttocks, buttocks outlined through tight clothing, exposed upper thighs, exposed thigh, deep/plunging neckline, tight shorts, tight leggings, tight mini skirt, fitted satin dress, bodycon dress, bikini, atau lingerie. Jangan menghapus detail seksual/dewasa yang memang terlihat hanya agar terdengar aman atau umum. Namun JANGAN mengarang nudity, genitalia, hidden anatomy, sexual acts, ukuran/bentuk tubuh yang tidak terlihat, identitas, atau etnisitas. Jika usia tidak jelas atau mungkin di bawah 18 tahun, wajib netral tanpa sexy/sexualized wording. Untuk subject non-manusia, tetap gunakan query pendek dan faktual serta pertahankan merek/model/spesifikasi OCR bila benar-benar terbaca. Evidence harus berupa fakta visual konkret; untuk person/human_figure tulis evidence dalam bahasa Inggris. "'''
          s, n = re.subn(r'^\s*val newHumanRule = ".*"\s*$', new_rule, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('newHumanRule replacement failed')

          old_norm = '''                val query = VisionSearchEvidence.refineQuery(normalizedQuery, localTextHint)\n                AiResponse(query, provider)'''
          new_norm = '''                val query = VisionSearchEvidence.refineQuery(normalizedQuery, localTextHint)\n                if (!VisionSearchEvidence.isDetailedHumanQueryAcceptable(query)) {\n                    throw IllegalStateException("Model ${provider.label} memberi deskripsi manusia terlalu generik; coba provider Vision berikutnya.")\n                }\n                AiResponse(query, provider)'''
          if 'isDetailedHumanQueryAcceptable(query)' not in s:
              if old_norm not in s:
                  raise SystemExit('normalize gate insertion point not found')
              s = s.replace(old_norm, new_norm, 1)

          s = s.replace('AI Ads Keyboard · v0.21.10 test', 'AI Ads Keyboard · v0.21.11 test')
          p.write_text(s)

          # 2) Stronger real-photo search hardening + generic-human rejection shared by ALL providers.
          p = Path('app/src/main/java/com/riyan/aikeyboard/VisionSearchEvidence.kt')
          s = p.read_text()
          old_ex = 'val exclusions = "real photo photography -AI -AI-generated -Midjourney -\\"Stable Diffusion\\" -illustration -render -CGI"'
          new_ex = 'val exclusions = "real photograph photography natural skin texture realistic lighting -AI -AI-generated -Midjourney -\\"Stable Diffusion\\" -Flux -DALL-E -illustration -render -CGI -3D -anime -\\"digital art\\""'
          if old_ex in s:
              s = s.replace(old_ex, new_ex, 1)
          elif 'natural skin texture' not in s:
              raise SystemExit('real-photo exclusion line not found')

          marker = '    private fun extractProductIdentity(localTextHint: String): String {'
          validator = r'''
    /**
     * Reject generic human descriptions so visionProduct() can fall through to another provider.
     * This gate is shared by OpenRouter, TabiAI, 9Router, BluesMinds, xKiro, OrcaRouter and AI Horde.
     */
    fun isDetailedHumanQueryAcceptable(query: String): Boolean {
        val clean = query.trim().replace(Regex("\\s+"), " ")
        if (!looksHuman(clean)) return true

        val lower = clean.lowercase()
        val words = clean.split(Regex("\\s+")).filter { it.isNotBlank() }
        if (words.size < 10) return false

        fun has(pattern: String): Boolean = Regex(pattern, RegexOption.IGNORE_CASE).containsMatchIn(lower)

        val hasClothing = has("\\b(dress|gown|shorts|leggings|pants|trousers|skirt|miniskirt|top|shirt|blouse|camisole|bikini|lingerie|swimsuit|bodysuit)\\b")
        if (!hasClothing) return false

        var detailGroups = 0
        if (has("\\b(front view|rear view|back view|side view|from behind|facing camera|facing away)\\b")) detailGroups++
        if (has("\\b(satin|silk|leather|denim|lace|spandex|lycra|tight|fitted|bodycon|body-hugging|skin-tight|plunging|deep v|thin straps|spaghetti straps)\\b")) detailGroups++
        if (has("\\b(cleavage|bust|breasts|defined waist|curvy hips|wide hips|buttocks|booty|thigh|thighs|bare shoulders|long legs)\\b")) detailGroups++
        if (has("\\b(long|short|wavy|curly|straight|black|brown|blonde|red)\\s+(?:hair)\\b")) detailGroups++
        if (has("\\b(bedroom|living room|art gallery|gallery|museum|street|outdoors|indoors|park|garden|studio)\\b")) detailGroups++
        if (has("\\b(standing|sitting|seated|walking|posing|leaning|kneeling)\\b")) detailGroups++

        if (detailGroups < 2) return false
        if (Regex("(?i)^adult (woman|man),? sexy,? wearing .{0,45}(walking|standing)?$").matches(clean)) return false
        return true
    }

'''
          if 'fun isDetailedHumanQueryAcceptable' not in s:
              if marker not in s:
                  raise SystemExit('validator insertion marker not found')
              s = s.replace(marker, validator + marker, 1)
          p.write_text(s)

          # 3) AI Horde/Alchemy gets the same direct adult body vocabulary when evidence supports it.
          p = Path('app/src/main/java/com/riyan/aikeyboard/HumanVisionPrompt.kt')
          s = p.read_text()
          anchor = '        if (!ageUnclear && has("\\\\b(cleavage|decolletage)\\\\b")) visibleDetails += "visible cleavage"\n'
          extra = anchor + '        if (!ageUnclear && has("\\\\b(large breasts|big breasts|full bust|large bust|prominent bust)\\\\b")) visibleDetails += "prominent full bust"\n'
          if 'prominent full bust' not in s:
              if anchor not in s:
                  raise SystemExit('HumanVisionPrompt bust anchor not found')
              s = s.replace(anchor, extra, 1)
          p.write_text(s)

          # 4) Bump file/build version only; installed app name remains AI Ads Keyboard.
          Path('app/build-version.txt').write_text('0.21.11-test-all-provider-adult-vision\n')
          Path('app/build-code.txt').write_text('32\n')
          PY

          rm -f .github/workflows/patch-all-vision-v02111.yml
          git config user.name 'Riyan3w'
          git config user.email '129081548+riyan3110@users.noreply.github.com'
          git add app/smart-vision.gradle.kts app/src/main/java/com/riyan/aikeyboard/VisionSearchEvidence.kt app/src/main/java/com/riyan/aikeyboard/HumanVisionPrompt.kt app/build-version.txt app/build-code.txt .github/workflows/patch-all-vision-v02111.yml
          git commit -m 'Enforce detailed adult vision prompts across all providers'
          git push origin HEAD:fix/vision-query-pan-zoom
