name: Repair vision regex escapes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/short-vision-query-search-engine-natural-adult' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Repair Kotlin regex strings and clean temp files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          s = p.read_text()
          replacements = {
              'Regex("(?i)^(?:query|search query|pencarian|hasil)\\s*:\\s*")': 'Regex("(?i)^(?:query|search query|pencarian|hasil)\\\\s*:\\\\s*")',
              'Regex("\\s+")': 'Regex("\\\\s+")',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'malformed regex not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

          rm -f tools/ci-trigger-vision-search.txt
          rm -f .github/workflows/fix-kotlin-regex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt tools/ci-trigger-vision-search.txt .github/workflows/fix-kotlin-regex.yml
          git commit -m "fix: repair vision query regex escapes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
