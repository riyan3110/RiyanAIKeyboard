name: Add AI Horde Alchemy vision

on:
  push:
    branches:
      - fix/short-vision-query-search-engine-natural-adult
    paths:
      - .github/workflows/add-ai-horde-alchemy-vision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-vision-query-search-engine-natural-adult
          fetch-depth: 0

      - name: Route AI Horde vision through Alchemy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riyan/aikeyboard/AiClient.kt')
          s = p.read_text()

          old_route = 'AiProvider.AIHORDE -> throw IllegalStateException("AI Horde saat ini dipakai untuk chat; Vision otomatis mencoba provider vision berikutnya.")'
          new_route = 'AiProvider.AIHORDE -> requestAiHordeVision(settings, jpegBase64, localTextHint)'
          if old_route in s:
              s = s.replace(old_route, new_route, 1)
          elif new_route not in s:
              raise SystemExit('AI Horde vision route anchor not found')

          marker = '''    private fun getJson(url: String, headers: Map<String, String>): JSONObject {'''
          if 'private fun requestAiHordeVision(' not in s:
              if marker not in s:
                  raise SystemExit('getJson insertion marker not found')
              block = r'''    private fun requestAiHordeVision(
        settings: AiSettings,
        jpegBase64: String,
        localTextHint: String
    ): String {
        val apiKey = settings.aiHordeApiKey.trim().ifBlank { "0000000000" }
        val headers = mapOf(
            "apikey" to apiKey,
            "Client-Agent" to "AI-Ads-Keyboard:0.21:https://github.com/riyan3110/RiyanAIKeyboard"
        )

        // AI Horde Alchemy accepts either a public image URL or raw base64. The scanner already
        // provides JPEG base64, so the image can be sent directly without uploading it elsewhere.
        // Caption + interrogation are visual evidence. NSFW is only a coarse flag and is never
        // used by itself to invent anatomy or exposure.
        val forms = JSONArray()
            .put(JSONObject().put("name", "caption"))
            .put(JSONObject().put("name", "interrogation"))
            .put(JSONObject().put("name", "nsfw"))
        val body = JSONObject()
            .put("source_image", jpegBase64)
            .put("forms", forms)
            .put("slow_workers", true)
            .put("extra_slow_workers", true)

        val submitted = postJson(
            url = "https://aihorde.net/api/v2/interrogate/async",
            headers = headers,
            body = body
        )
        val requestId = submitted.optString("id").trim()
        require(requestId.isNotBlank()) {
            submitted.optString("message").ifBlank { "AI Horde Alchemy tidak mengembalikan ID antrean." }
        }

        val deadline = System.currentTimeMillis() + 150_000L
        while (System.currentTimeMillis() < deadline) {
            Thread.sleep(1_500L)
            val status = getJson(
                "https://aihorde.net/api/v2/interrogate/status/$requestId",
                headers
            )
            val state = status.optString("state").lowercase()
            if (state == "faulted" || state == "cancelled") {
                error("AI Horde Alchemy gagal membaca gambar.")
            }

            val statusForms = status.optJSONArray("forms")
            var caption = ""
            var nsfw: Boolean? = null
            val tags = mutableListOf<Pair<String, Double>>()
            var completedForms = 0

            if (statusForms != null) {
                for (index in 0 until statusForms.length()) {
                    val form = statusForms.optJSONObject(index) ?: continue
                    val formState = form.optString("state").lowercase()
                    if (formState == "done") completedForms++
                    val result = form.optJSONObject("result") ?: continue
                    when (form.optString("form").lowercase()) {
                        "caption" -> {
                            val value = result.optString("caption").trim()
                            if (value.isNotBlank()) caption = value
                        }
                        "nsfw" -> if (result.has("nsfw")) {
                            nsfw = result.optBoolean("nsfw")
                        }
                        "interrogation" -> {
                            val details = result.optJSONObject("interrogation") ?: result
                            val tagArray = details.optJSONArray("tags")
                            if (tagArray != null) {
                                for (tagIndex in 0 until tagArray.length()) {
                                    val item = tagArray.optJSONObject(tagIndex) ?: continue
                                    val text = item.optString("text").trim()
                                    val confidence = item.optDouble("confidence", 0.0)
                                    if (text.isNotBlank() && confidence >= 0.28) {
                                        tags += text to confidence
                                    }
                                }
                            }
                        }
                    }
                }
            }

            val allDone = state == "done" || (statusForms != null && statusForms.length() > 0 && completedForms == statusForms.length())
            if (allDone) {
                val sortedTags = tags
                    .sortedByDescending { it.second }
                    .map { it.first }
                    .distinctBy { it.lowercase() }
                    .take(8)
                if (caption.isBlank() && sortedTags.isEmpty()) {
                    error("AI Horde Alchemy selesai tetapi tidak mengembalikan caption/tag gambar.")
                }

                val translatedCaption = translateAiHordeVisionText(caption)
                val translatedTags = sortedTags.map(::translateAiHordeVisionText)
                val query = compactAiHordeVisionQuery(translatedCaption, translatedTags)
                if (query.isBlank()) {
                    error("AI Horde Alchemy tidak menemukan ciri visual yang cukup jelas.")
                }

                val combinedEvidence = buildString {
                    if (translatedCaption.isNotBlank()) append(translatedCaption)
                    if (translatedTags.isNotEmpty()) {
                        if (isNotEmpty()) append("; ")
                        append(translatedTags.take(4).joinToString(", "))
                    }
                    if (nsfw != null) {
                        if (isNotEmpty()) append("; ")
                        append(if (nsfw == true) "detektor NSFW positif" else "detektor NSFW negatif")
                    }
                }.take(420)

                val subjectType = inferAiHordeSubjectType(translatedCaption, translatedTags)
                val confidence = when {
                    caption.isNotBlank() && sortedTags.isNotEmpty() -> 0.78
                    caption.isNotBlank() -> 0.68
                    else -> 0.58
                }
                return JSONObject()
                    .put("subject_type", subjectType)
                    .put("confidence", confidence)
                    .put("query", query)
                    .put("evidence", combinedEvidence.ifBlank { query })
                    .toString()
            }
        }
        error("AI Horde Alchemy masih antre terlalu lama. Coba lagi atau aktifkan fallback provider.")
    }

    private fun translateAiHordeVisionText(raw: String): String {
        var text = raw.trim().lowercase()
        if (text.isBlank()) return ""

        val phrases = listOf(
            "tight leggings" to "legging ketat",
            "yoga pants" to "legging",
            "mini skirt" to "rok mini",
            "miniskirt" to "rok mini",
            "tight skirt" to "rok ketat",
            "satin skirt" to "rok satin",
            "tight shorts" to "celana pendek ketat",
            "short shorts" to "celana pendek",
            "crop top" to "crop top",
            "tight shirt" to "baju ketat",
            "tight top" to "baju ketat",
            "tank top" to "tank top",
            "sports bra" to "bra olahraga",
            "underwear" to "pakaian dalam",
            "bathing suit" to "baju renang",
            "swimsuit" to "baju renang",
            "bare breasts" to "payudara terbuka",
            "bare breast" to "payudara terbuka",
            "large breasts" to "payudara besar",
            "large breast" to "payudara besar",
            "female breast" to "payudara",
            "female breasts" to "payudara",
            "bare buttocks" to "bokong terbuka",
            "bare butt" to "bokong terbuka"
        )
        phrases.forEach { (from, to) -> text = text.replace(from, to) }

        val words = listOf(
            "women" to "wanita", "woman" to "wanita", "female" to "wanita",
            "men" to "pria", "man" to "pria", "male" to "pria",
            "people" to "orang", "person" to "orang",
            "leggings" to "legging", "pants" to "celana", "trousers" to "celana",
            "shorts" to "celana pendek", "skirt" to "rok", "dress" to "gaun",
            "shirt" to "baju", "top" to "atasan", "bra" to "bra",
            "breasts" to "payudara", "breast" to "payudara",
            "nipples" to "puting", "nipple" to "puting",
            "buttocks" to "bokong", "buttock" to "bokong", "butt" to "bokong",
            "vulva" to "vulva", "vagina" to "vagina", "penis" to "penis",
            "scrotum" to "skrotum", "anus" to "anus", "clitoris" to "klitoris",
            "nude" to "telanjang", "naked" to "telanjang",
            "brown" to "cokelat", "black" to "hitam", "white" to "putih",
            "red" to "merah", "blue" to "biru", "green" to "hijau",
            "pink" to "merah muda", "gray" to "abu-abu", "grey" to "abu-abu",
            "outdoor" to "luar ruangan", "outdoors" to "luar ruangan"
        )
        words.forEach { (from, to) ->
            text = text.replace(Regex("(?i)\\b${Regex.escape(from)}\\b"), to)
        }
        return text.replace(Regex("\\s+"), " ").trim()
    }

    private fun compactAiHordeVisionQuery(caption: String, tags: List<String>): String {
        val source = listOf(caption).plus(tags.take(5)).filter { it.isNotBlank() }.joinToString(" ")
        if (source.isBlank()) return ""
        val lower = source.lowercase()
        val uncertainAge = Regex("\\b(girl|boy|child|kid|teen|teenager|minor|baby|young girl|young boy)\\b", RegexOption.IGNORE_CASE)
            .containsMatchIn(lower)

        val stopWords = setOf(
            "a", "an", "the", "is", "are", "was", "were", "with", "and", "or", "of", "to", "from",
            "in", "on", "at", "near", "by", "for", "wearing", "wears", "standing", "sitting", "posing",
            "this", "that", "there", "image", "photo", "picture", "shows", "showing",
            "di", "dan", "yang", "dengan", "dari", "untuk", "sedang", "memakai", "mengenakan",
            "berdiri", "duduk", "berpose", "sebuah", "foto", "gambar", "terlihat"
        )
        val sensitiveWhenAgeUnclear = setOf(
            "payudara", "puting", "vulva", "vagina", "penis", "skrotum", "bokong", "anus", "klitoris",
            "telanjang", "seksi", "sex", "sexual"
        )

        val tokens = source
            .replace(Regex("[^a-z0-9À-ÿ_-]+", RegexOption.IGNORE_CASE), " ")
            .split(Regex("\\s+"))
            .map { it.trim('-','_') }
            .filter { it.length >= 2 && it !in stopWords }
            .filterNot { uncertainAge && it in sensitiveWhenAgeUnclear }
            .distinct()
            .toMutableList()

        val prefix = when {
            uncertainAge -> "orang"
            Regex("\\bwanita\\b").containsMatchIn(lower) -> "wanita"
            Regex("\\bpria\\b").containsMatchIn(lower) -> "pria"
            Regex("\\borang\\b").containsMatchIn(lower) -> "orang"
            else -> ""
        }
        if (prefix.isNotBlank()) {
            tokens.removeAll { it == "wanita" || it == "pria" || it == "orang" }
            tokens.add(0, prefix)
        }
        return tokens.take(7).joinToString(" ").take(64).trim()
    }

    private fun inferAiHordeSubjectType(caption: String, tags: List<String>): String {
        val text = (caption + " " + tags.joinToString(" ")).lowercase()
        return when {
            Regex("\\b(wanita|pria|orang|woman|women|man|men|person|people|girl|boy|child|human)\\b")
                .containsMatchIn(text) -> "person"
            Regex("\\b(dog|cat|bird|horse|cow|animal|anjing|kucing|burung|kuda|hewan)\\b")
                .containsMatchIn(text) -> "animal"
            Regex("\\b(car|motorcycle|bike|bicycle|truck|bus|vehicle|mobil|motor|sepeda|kendaraan)\\b")
                .containsMatchIn(text) -> "vehicle"
            Regex("\\b(food|meal|dish|cake|drink|makanan|minuman)\\b").containsMatchIn(text) -> "food"
            Regex("\\b(plant|flower|tree|tanaman|bunga|pohon)\\b").containsMatchIn(text) -> "plant"
            Regex("\\b(text|document|sign|label|teks|dokumen)\\b").containsMatchIn(text) -> "text"
            else -> "object"
        }
    }

'''
              s = s.replace(marker, block + marker, 1)

          p.write_text(s)
