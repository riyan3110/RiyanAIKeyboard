name: Add AI Horde Alchemy vision

on:
  push:
    branches:
      - fix/short-vision-query-search-engine-natural-adult
    paths:
      - .github/workflows/add-ai-horde-alchemy-vision.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-vision-query-search-engine-natural-adult
          fetch-depth: 0

      - name: Route AI Horde vision through Alchemy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/riyan/aikeyboard/AiClient.kt')
          s = p.read_text()
          old = 'AiProvider.AIHORDE -> throw IllegalStateException("AI Horde saat ini dipakai untuk chat; Vision otomatis mencoba provider vision berikutnya.")'
          new = 'AiProvider.AIHORDE -> AiHordeAlchemyVision.request(settings, jpegBase64)'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('AI Horde vision route anchor not found')
          p.write_text(s)
          PY

      - name: Commit route change
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt
          git commit -m "Route AI Horde images through Alchemy"
          git push origin HEAD:fix/short-vision-query-search-engine-natural-adult
