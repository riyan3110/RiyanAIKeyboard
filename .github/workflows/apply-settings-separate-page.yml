name: Apply separate settings page wiring

on:
  push:
    branches:
      - ui/settings-separate-page-v1
    paths:
      - .github/workflows/apply-settings-separate-page.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/settings-separate-page-v1

      - name: Route keyboard settings to separate page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          service = service_path.read_text()

          old_add = '        addSettingsPanel()\n'
          if old_add not in service:
              raise SystemExit('addSettingsPanel() call not found')
          service = service.replace(old_add, '', 1)

          old_button = '''        utilityBar.addView(\n            toolbarIconButton(R.drawable.ic_settings_modern, "Pengaturan", dp(38)) { openSettings() }\n        )'''
          new_button = '''        utilityBar.addView(\n            toolbarIconButton(R.drawable.ic_settings_modern, "Pengaturan", dp(38)) {\n                startActivity(\n                    Intent(this@RiyanKeyboardService, SettingsActivity::class.java)\n                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n                )\n            }\n        )'''
          if old_button not in service:
              raise SystemExit('settings toolbar button anchor not found')
          service = service.replace(old_button, new_button, 1)
          service_path.write_text(service)

          overlay_path = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt')
          overlay = overlay_path.read_text()
          old_picker = '''                context.startActivity(\n                    Intent(context, ThemePhotoPickerActivity::class.java)\n                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n                )'''
          new_picker = '''                val pickerIntent = Intent(context, ThemePhotoPickerActivity::class.java)\n                if (context !is android.app.Activity) {\n                    pickerIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n                }\n                context.startActivity(pickerIntent)'''
          if old_picker not in overlay:
              raise SystemExit('theme photo picker anchor not found')
          overlay = overlay.replace(old_picker, new_picker, 1)
          overlay_path.write_text(overlay)
          PY

          rm -f .github/workflows/apply-settings-separate-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move latest settings UI to separate page"
          git push origin HEAD:ui/settings-separate-page-v1
