name: Build APK

on:
  push:
    branches: [main, codex/key-size-preview-v015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.riyan-ai-keyboard/debug.keystore
          key: ${{ runner.os }}-riyan-ai-debug-keystore-v2

      - name: Create stable debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.riyan-ai-keyboard"
          if [ ! -f "$HOME/.riyan-ai-keyboard/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.riyan-ai-keyboard/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Riyan AI Keyboard Debug,O=Riyan,C=ID" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply keyboard feature patches
        run: python3 tools/apply_keyboard_memory_patch.py

      - name: Apply full-screen OCR cache patch
        run: python3 tools/apply_fullscreen_ocr_cache_patch.py

      - name: Apply delete compatibility patch
        run: python3 tools/apply_delete_compat_patch.py

      - name: Apply automatic multi-source research patch
        run: python3 tools/apply_auto_multisource_patch.py

      - name: Apply reference bubble key styling
        run: python3 tools/apply_bubble_keys_patch.py

      - name: Finish v0.18 panel frame
        run: python3 tools/apply_v018_frame_fix.py

      - name: Finish v0.18 web input routing
        run: python3 tools/apply_v018_web_input_fix.py

      - name: Finish v0.18 camera accuracy
        run: python3 tools/apply_v018_camera_accuracy_fix.py

      - name: Fix v0.18 Kotlin regex escaping
        run: python3 tools/apply_v018_kotlin_escape_fix.py

      - name: Fix v0.18 embedded navigation and corners
        run: python3 tools/apply_v018_web_navigation_corner_fix.py

      - name: Add true visual object search and Back button
        run: python3 tools/apply_v018_true_visual_search_back_fix_v2.py

      - name: Match product by shape and strong main text
        run: python3 tools/apply_v018_visual_product_match_v3.py

      - name: Fix regex escaping after visual product patch
        run: python3 tools/apply_v018_kotlin_escape_fix.py

      - name: Build debug APK
        run: RIYAN_KEYSTORE_PATH="$HOME/.riyan-ai-keyboard/debug.keystore" gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ads-Keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
