name: Build APK

on:
  push:
    branches: [ main, private-main, release/v0.21.24-exact-v0.21.22-preserve-data ]
  pull_request:
    branches: [ main, private-main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.riyan-ai-keyboard/debug.keystore
          key: ${{ runner.os }}-riyan-ai-debug-keystore-v2

      - name: Create stable debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.riyan-ai-keyboard"
          if [ ! -f "$HOME/.riyan-ai-keyboard/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.riyan-ai-keyboard/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Riyan AI Keyboard Debug,O=Riyan,C=ID" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Apply persistent test-build version metadata
        shell: bash
        run: |
          if [ -f app/build-version.txt ]; then
            VERSION_NAME=$(tr -d '\r\n' < app/build-version.txt)
            sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          fi
          if [ -f app/build-code.txt ]; then
            VERSION_CODE=$(tr -d '\r\n' < app/build-code.txt)
            sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          fi
          grep -E 'version(Code|Name)' app/build.gradle.kts

      - name: Install WebP conversion tool for APK icon compatibility
        shell: bash
        run: |
          if ! command -v dwebp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends webp
          fi

      - name: Apply PRIVATE provider, browser, photo color, safe key scale, auto-caps, brand, haptic, Shift, popup, gap, and reference URL patches
        shell: bash
        run: |
          python3 tools/apply_bluesminds_provider_patch.py
          python3 tools/apply_browser_chrome_patch.py
          python3 tools/apply_photo_colors_safe_scale_patch.py
          python3 tools/apply_bai_provider_patch.py
          python3 tools/apply_private_extra_providers_patch.py
          python3 tools/apply_private_reference_urls_patch.py
          python3 tools/apply_autocaps_brand_patch.py
          python3 tools/allow_brand_only_visible_label.py
          python3 tools/apply_private_haptic_shift_popup_gap_patch.py
          python3 tools/apply_private_tighter_gap_patch.py

      - name: Build test APK
        run: RIYAN_KEYSTORE_PATH="$HOME/.riyan-ai-keyboard/debug.keystore" gradle :app:testDebugUnitTest :app:assembleDebug -x :app:patchBluesMindsProvider

      - name: Give APK a permanent versioned filename
        id: package
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="unknown-version"
          fi
          SAFE_VERSION=$(printf '%s' "$VERSION_NAME" | tr -cs 'A-Za-z0-9._-' '-')
          APK_NAME="AI-Ads-Keyboard-${SAFE_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/debug/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=AI-Ads-Keyboard-${SAFE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.apk_path }}
