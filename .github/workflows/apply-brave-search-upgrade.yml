name: Apply Brave Search browser upgrade

on:
  push:
    branches:
      - feat/brave-search-latest

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brave-search-latest
          fetch-depth: 0

      - name: Switch embedded search browser to Brave Search
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          text = path.read_text()

          # Rename the search helper so future work no longer refers to Google/Bing.
          text = text.replace('googleSearchUrl', 'braveSearchUrl')
          text = text.replace('openBingImageResults', 'openBraveImageResults')

          # Main web searches now use Brave Search.
          old = '''    private fun braveSearchUrl(query: String): String = Uri.Builder()
                  .scheme("https")
                  .authority("www.bing.com")
                  .path("search")
                  .appendQueryParameter("q", query)
                  .build()
                  .toString()'''
          new = '''    private fun braveSearchUrl(query: String): String = Uri.Builder()
                  .scheme("https")
                  .authority("search.brave.com")
                  .path("search")
                  .appendQueryParameter("q", query)
                  .appendQueryParameter("source", "web")
                  .build()
                  .toString()'''
          if old not in text:
              raise SystemExit('Brave search helper target not found')
          text = text.replace(old, new, 1)

          # Image-search fallbacks from camera/gallery now stay inside Brave Search.
          text = text.replace(
              'https://www.bing.com/images/search?q=${Uri.encode(query)}&adlt=off',
              'https://search.brave.com/images?q=${Uri.encode(query)}&source=web'
          )
          text = text.replace(
              'https://www.bing.com/images/search?q=${Uri.encode(clean)}&adlt=off',
              'https://search.brave.com/images?q=${Uri.encode(clean)}&source=web'
          )

          # Keep the generic WebView file chooser/camera permission bridge usable on Brave pages.
          text = text.replace(
              'host == "bing.com" || host.endsWith(".bing.com") ||\n                            host == "google.com" || host.endsWith(".google.com")',
              'host == "search.brave.com" || host.endsWith(".brave.com") ||\n                            host == "bing.com" || host.endsWith(".bing.com") ||\n                            host == "google.com" || host.endsWith(".google.com")'
          )

          text = text.replace(
              'Izinkan akses kamera AI Ads Keyboard agar kamera Microsoft Bing dapat digunakan.',
              'Izinkan akses kamera AI Ads Keyboard agar kamera di halaman Brave dapat digunakan.'
          )
          text = text.replace(
              'val visualUrl: String? = null // Microsoft Bing remains the embedded visual-search surface.',
              'val visualUrl: String? = null // Brave Search remains the embedded search surface.'
          )

          # The renderer stays the real Android System WebView UA. Do not fake a newer engine.
          marker = 'settings.userAgentString = WebSettings.getDefaultUserAgent(this@RiyanKeyboardService)'
          replacement = '''settings.userAgentString = WebSettings.getDefaultUserAgent(this@RiyanKeyboardService)
                  // Brave Search is server-updated; keep the actual WebView UA for renderer compatibility.'''
          text = text.replace(marker, replacement)

          path.write_text(text)

          # Self-remove this one-shot workflow so the branch only keeps real app changes.
          Path('.github/workflows/apply-brave-search-upgrade.yml').unlink()

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt .github/workflows/apply-brave-search-upgrade.yml
          git commit -m "feat: switch embedded search browser to Brave Search"
          git push origin HEAD:feat/brave-search-latest
