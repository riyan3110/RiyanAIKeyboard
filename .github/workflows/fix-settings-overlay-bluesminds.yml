name: Fix Settings Overlay BluesMinds

on:
  push:
    branches:
      - ui/settings-overlay-v1
    paths:
      - .github/workflows/fix-settings-overlay-bluesminds.yml
      - tools/fix_settings_overlay_bluesminds.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/settings-overlay-v1
      - name: Apply fix
        run: python3 tools/fix_settings_overlay_bluesminds.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-settings-overlay-bluesminds.yml
          rm -f tools/fix_settings_overlay_bluesminds.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support BluesMinds in settings overlay"
          git push origin HEAD:ui/settings-overlay-v1
