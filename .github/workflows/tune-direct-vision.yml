name: Tune direct vision wording

on:
  push:
    branches: ["fix/short-vision-query-search-engine-natural-adult"]
    paths: [".github/workflows/tune-direct-vision.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-vision-query-search-engine-natural-adult
          fetch-depth: 0
      - name: Patch source
        run: python3 .github/scripts/tune_direct_vision.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt app/src/main/java/com/riyan/aikeyboard/AiHordeAlchemyVision.kt
          git commit -m "Make AI Horde vision wording more direct"
          git push origin HEAD:fix/short-vision-query-search-engine-natural-adult
