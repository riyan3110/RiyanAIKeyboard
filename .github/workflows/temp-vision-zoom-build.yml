name: Temp Vision Query Pan Zoom Build

on:
  push:
    branches: [fix/vision-query-pan-zoom]

permissions:
  contents: write

jobs:
  repair-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[final-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-query-pan-zoom
          fetch-depth: 0

      - name: Repair vision regex
        run: python3 tools/temp_repair_vision_regex.py

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiHordeAlchemyVision.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix vision regex and prepare final build [final-build]"
            git push origin HEAD:fix/vision-query-pan-zoom
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.riyan-ai-keyboard/debug.keystore
          key: ${{ runner.os }}-riyan-ai-debug-keystore-v2

      - name: Create stable debug signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.riyan-ai-keyboard"
          if [ ! -f "$HOME/.riyan-ai-keyboard/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.riyan-ai-keyboard/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Riyan AI Keyboard Debug,O=Riyan,C=ID" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build debug APK
        run: RIYAN_KEYSTORE_PATH="$HOME/.riyan-ai-keyboard/debug.keystore" gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ads-Keyboard-vision-pan-zoom
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
