name: Temp Vision Query Pan Zoom Build

on:
  push:
    branches: [fix/vision-query-pan-zoom]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[vision-zoom-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-query-pan-zoom
          fetch-depth: 0

      - name: Fix helper typo and validate Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/temp_fix_vision_zoom.py')
          s = p.read_text()
          s = s.replace(
              'override fun onScale(detector: ScaleGestureDetector): Boolean = true\\n\\n            override fun onScale(detector: ScaleGestureDetector): Boolean {',
              'override fun onScaleBegin(detector: ScaleGestureDetector): Boolean = true\\n\\n            override fun onScale(detector: ScaleGestureDetector): Boolean {'
          )
          p.write_text(s)
          PY
          python3 -m py_compile tools/temp_fix_vision_zoom.py

      - name: Apply source fixes
        run: python3 tools/temp_fix_vision_zoom.py

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt \
                  app/src/main/java/com/riyan/aikeyboard/AiHordeAlchemyVision.kt \
                  app/src/main/java/com/riyan/aikeyboard/AiClient.kt
          git diff --cached --check
          git commit -m "Fix vision query and scanner pan zoom [vision-zoom-patched]"
          git push origin HEAD:fix/vision-query-pan-zoom

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ads-Keyboard-vision-pan-zoom
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
