name: Apply Direct Photo And Modern Icons

on:
  push:
    branches: [ chore/direct-photo-modern-icons ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/direct-photo-modern-icons
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_modern_icons_patch.py

      - name: Remove one-time patch helpers
        run: |
          rm -f tools/apply_modern_icons_patch.py
          rm -f .github/workflows/apply-modern-icons.yml

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "feat: open photo picker directly and modernize action icons"
          git push origin HEAD:chore/direct-photo-modern-icons
