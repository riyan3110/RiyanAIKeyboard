name: Apply custom keyboard color controls

on:
  push:
    branches: [ feat/custom-key-colors-150 ]
    paths:
      - .github/workflows/apply-custom-key-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-key-colors-150
          fetch-depth: 0

      - name: Patch keyboard color controls and 150 percent scale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch target: {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          settings = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt')
          s = settings.read_text()
          old = '''        var themeMode: String,
                  var themeColor: String,
                  var portraitHeight: Int,'''
          new = '''        var themeMode: String,
                  var themeColor: String,
                  var themeBorderColor: String,
                  var themeKeyColor: String,
                  var themeLetterColor: String,
                  var themeNumberColor: String,
                  var portraitHeight: Int,'''
          if old not in s:
              raise SystemExit('missing Draft theme color fields target')
          s = s.replace(old, new, 1)

          old = '''        if (draft.themeMode == KeyboardTheme.MODE_CUSTOM) {
                      body.addView(textInput("Warna, contoh #5D4AC4", draft.themeColor) { draft.themeColor = it }, LinearLayout.LayoutParams(-1, dp(46)).apply {
                          topMargin = dp(8)
                      })
                  }
          '''
          new = '''        if (draft.themeMode == KeyboardTheme.MODE_CUSTOM) {
                      val colorCard = cardContainer()
                      colorCard.addView(section("Warna Manual", compact = true))
                      colorCard.addView(description("Atur setiap bagian secara terpisah. Ketuk tombol untuk membuka pemilih warna manual."))
                      colorCard.addView(colorSettingButton("Bingkai", draft.themeBorderColor) { anchor ->
                          ManualColorPickerDialog.show(anchor, "Bingkai", parseDraftColor(draft.themeBorderColor, accent)) { picked ->
                              val hex = colorToHex(picked)
                              draft.themeBorderColor = hex
                              draft.themeColor = hex
                              renderBody()
                          }
                      })
                      colorCard.addView(colorSettingButton("Warna tombol", draft.themeKeyColor) { anchor ->
                          ManualColorPickerDialog.show(anchor, "Warna tombol", parseDraftColor(draft.themeKeyColor, Color.rgb(50, 50, 60))) { picked ->
                              draft.themeKeyColor = colorToHex(picked)
                              renderBody()
                          }
                      })
                      colorCard.addView(colorSettingButton("Warna huruf", draft.themeLetterColor) { anchor ->
                          ManualColorPickerDialog.show(anchor, "Warna huruf", parseDraftColor(draft.themeLetterColor, Color.WHITE)) { picked ->
                              draft.themeLetterColor = colorToHex(picked)
                              renderBody()
                          }
                      })
                      colorCard.addView(colorSettingButton("Warna angka", draft.themeNumberColor) { anchor ->
                          ManualColorPickerDialog.show(anchor, "Warna angka", parseDraftColor(draft.themeNumberColor, Color.WHITE)) { picked ->
                              draft.themeNumberColor = colorToHex(picked)
                              renderBody()
                          }
                      })
                      body.addView(colorCard, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })
                  }
          '''
          if old not in s:
              raise SystemExit('missing custom theme editor target')
          s = s.replace(old, new, 1)

          old = 'keyCard.addView(sliderRow("Skala Kotak Tombol", 65, 110, draft.keyBoxScale, "%") { draft.keyBoxScale = it })'
          new = 'keyCard.addView(sliderRow("Skala Kotak Tombol", 65, 150, draft.keyBoxScale, "%") { draft.keyBoxScale = it })'
          if old not in s:
              raise SystemExit('missing key scale slider target')
          s = s.replace(old, new, 1)

          old = '''            .putString("keyboard_theme_mode", draft.themeMode)
                      .putString("keyboard_theme_color", KeyboardTheme.normalizeColor(draft.themeColor))
                      .putInt("keyboard_height_portrait_dp", draft.portraitHeight)'''
          new = '''            .putString("keyboard_theme_mode", draft.themeMode)
                      .putString("keyboard_theme_color", KeyboardTheme.normalizeColor(draft.themeColor))
                      .putString("keyboard_custom_border_color", KeyboardTheme.normalizeColor(draft.themeBorderColor))
                      .putString("keyboard_custom_key_color", KeyboardTheme.normalizeColor(draft.themeKeyColor))
                      .putString("keyboard_custom_letter_color", KeyboardTheme.normalizeColor(draft.themeLetterColor))
                      .putString("keyboard_custom_number_color", KeyboardTheme.normalizeColor(draft.themeNumberColor))
                      .putInt("keyboard_height_portrait_dp", draft.portraitHeight)'''
          if old not in s:
              raise SystemExit('missing save theme colors target')
          s = s.replace(old, new, 1)

          old = '''        themeMode = prefs.getString("keyboard_theme_mode", KeyboardTheme.MODE_DARK).orEmpty(),
                  themeColor = prefs.getString("keyboard_theme_color", "#5D4AC4").orEmpty(),
                  portraitHeight = prefs.getInt("keyboard_height_portrait_dp", 220),'''
          new = '''        themeMode = prefs.getString("keyboard_theme_mode", KeyboardTheme.MODE_DARK).orEmpty(),
                  themeColor = prefs.getString("keyboard_theme_color", "#5D4AC4").orEmpty(),
                  themeBorderColor = prefs.getString("keyboard_custom_border_color", prefs.getString("keyboard_theme_color", "#B556F9")).orEmpty(),
                  themeKeyColor = prefs.getString("keyboard_custom_key_color", "#32323C").orEmpty(),
                  themeLetterColor = prefs.getString("keyboard_custom_letter_color", "#FFFFFF").orEmpty(),
                  themeNumberColor = prefs.getString("keyboard_custom_number_color", "#FFFFFF").orEmpty(),
                  portraitHeight = prefs.getInt("keyboard_height_portrait_dp", 220),'''
          if old not in s:
              raise SystemExit('missing load theme colors target')
          s = s.replace(old, new, 1)

          old = '''        themeMode = KeyboardTheme.MODE_DARK,
                  themeColor = "#5D4AC4",
                  portraitHeight = 220,'''
          new = '''        themeMode = KeyboardTheme.MODE_DARK,
                  themeColor = "#5D4AC4",
                  themeBorderColor = "#B556F9",
                  themeKeyColor = "#32323C",
                  themeLetterColor = "#FFFFFF",
                  themeNumberColor = "#FFFFFF",
                  portraitHeight = 220,'''
          if old not in s:
              raise SystemExit('missing default theme colors target')
          s = s.replace(old, new, 1)

          helper_marker = '''    private fun themePreviewText(label: String, previewColor: Int): SpannableString {'''
          helper_code = '''    private fun parseDraftColor(value: String, fallback: Int): Int =
                  runCatching { Color.parseColor(KeyboardTheme.normalizeColor(value)) }.getOrDefault(fallback)

              private fun colorToHex(color: Int): String = String.format("#%06X", 0xFFFFFF and color)

              private fun colorSettingButton(label: String, colorValue: String, onPick: (View) -> Unit): LinearLayout {
                  val selectedColor = parseDraftColor(colorValue, accent)
                  val row = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), dp(7), dp(10), dp(7))
                      background = rounded(field, 9f, selectedColor, 2)
                      setOnClickListener { onPick(this) }
                  }
                  row.addView(View(context).apply {
                      background = rounded(selectedColor, 7f, Color.argb(180, 255, 255, 255), 1)
                  }, LinearLayout.LayoutParams(dp(30), dp(30)).apply { rightMargin = dp(10) })
                  row.addView(TextView(context).apply {
                      text = "$label\\n${colorToHex(selectedColor)}"
                      textSize = 11.5f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, Typeface.BOLD)
                  }, LinearLayout.LayoutParams(0, dp(42), 1f))
                  row.addView(TextView(context).apply {
                      text = "›"
                      textSize = 25f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(205, 199, 220))
                  }, LinearLayout.LayoutParams(dp(34), dp(42)))
                  row.layoutParams = LinearLayout.LayoutParams(-1, dp(58)).apply { topMargin = dp(6) }
                  return row
              }

          '''
          if helper_marker not in s:
              raise SystemExit('missing settings helper insertion target')
          s = s.replace(helper_marker, helper_code + helper_marker, 1)
          settings.write_text(s)

          theme = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardTheme.kt')
          t = theme.read_text()
          old = '''    val accent: Int,
              val text: Int,
              val usesPhoto: Boolean
          )'''
          new = '''    val accent: Int,
              val text: Int,
              val usesPhoto: Boolean,
              val border: Int = Color.rgb(181, 86, 249),
              val numberText: Int = Color.WHITE
          )'''
          if old not in t:
              raise SystemExit('missing palette fields target')
          t = t.replace(old, new, 1)

          old = '''        val custom = parseColor(prefs.getString("keyboard_theme_color", "#5D4AC4"), Color.rgb(93, 74, 196))
                  val accent = when (mode) {'''
          new = '''        val custom = parseColor(prefs.getString("keyboard_theme_color", "#5D4AC4"), Color.rgb(93, 74, 196))
                  val customBorder = parseColor(prefs.getString("keyboard_custom_border_color", "#B556F9"), Color.rgb(181, 86, 249))
                  val customKey = parseColor(prefs.getString("keyboard_custom_key_color", "#32323C"), Color.rgb(50, 50, 60))
                  val customLetter = parseColor(prefs.getString("keyboard_custom_letter_color", "#FFFFFF"), Color.WHITE)
                  val customNumber = parseColor(prefs.getString("keyboard_custom_number_color", "#FFFFFF"), Color.WHITE)
                  val accent = when (mode) {'''
          if old not in t:
              raise SystemExit('missing custom palette pref target')
          t = t.replace(old, new, 1)

          old = '''        return KeyboardThemePalette(
                      background = blend(accent, Color.BLACK, 0.76f),
                      key = blend(accent, Color.rgb(45, 45, 53), 0.48f),
                      specialKey = blend(accent, Color.rgb(27, 55, 68), 0.42f),
                      pressedKey = blend(accent, Color.WHITE, 0.10f),
                      accent = accent,
                      text = Color.WHITE,
                      usesPhoto = false
                  )'''
          new = '''        if (mode == MODE_CUSTOM) {
                      return KeyboardThemePalette(
                          background = blend(customBorder, Color.BLACK, 0.82f),
                          key = customKey,
                          specialKey = customKey,
                          pressedKey = blend(customKey, customBorder, 0.28f),
                          accent = customBorder,
                          text = customLetter,
                          usesPhoto = false,
                          border = customBorder,
                          numberText = customNumber
                      )
                  }
                  return KeyboardThemePalette(
                      background = blend(accent, Color.BLACK, 0.76f),
                      key = blend(accent, Color.rgb(45, 45, 53), 0.48f),
                      specialKey = blend(accent, Color.rgb(27, 55, 68), 0.42f),
                      pressedKey = blend(accent, Color.WHITE, 0.10f),
                      accent = accent,
                      text = Color.WHITE,
                      usesPhoto = false
                  )'''
          if old not in t:
              raise SystemExit('missing final palette target')
          t = t.replace(old, new, 1)

          old = '''    private fun parseColor(value: String?, fallback: Int): Int =
                  runCatching { Color.parseColor(normalizeColor(value.orEmpty())) }.getOrDefault(fallback)'''
          new = '''    private fun parseColor(value: String?, fallback: Int): Int {
                  val raw = value.orEmpty().trim()
                  if (raw.isBlank()) return fallback
                  val normalized = if (raw.startsWith("#")) raw else "#$raw"
                  return runCatching { Color.parseColor(normalized) }.getOrDefault(fallback)
              }'''
          if old not in t:
              raise SystemExit('missing parseColor target')
          t = t.replace(old, new, 1)
          theme.write_text(t)

          service = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          r = service.read_text()
          old = '''    private var purple = Color.rgb(89, 68, 196)
              private var keyTextColor = Color.WHITE
              private var themeUsesPhoto = false'''
          new = '''    private var purple = Color.rgb(89, 68, 196)
              private var keyTextColor = Color.WHITE
              private var keyNumberColor = Color.WHITE
              private var keyBorderColor = Color.rgb(181, 86, 249)
              private var themeUsesPhoto = false'''
          if old not in r:
              raise SystemExit('missing service color vars target')
          r = r.replace(old, new, 1)

          old = 'keyBoxScale = prefs.getInt("key_box_scale_percent", 100).coerceIn(65, 110) / 100f'
          new = 'keyBoxScale = prefs.getInt("key_box_scale_percent", 100).coerceIn(65, 150) / 100f'
          if old not in r:
              raise SystemExit('missing service key scale clamp target')
          r = r.replace(old, new, 1)

          old = '''        keyTextColor = palette.text
                  themeUsesPhoto = palette.usesPhoto'''
          new = '''        keyTextColor = palette.text
                  keyNumberColor = palette.numberText
                  keyBorderColor = palette.border
                  themeUsesPhoto = palette.usesPhoto'''
          if old not in r:
              raise SystemExit('missing service palette assignment target')
          r = r.replace(old, new, 1)

          old = '''            scaleX = (keyBoxScale * if (referenceWideKey) 0.98f else 0.94f).coerceAtMost(1f)
                      scaleY = (keyBoxScale * if (referenceLargeKey) 0.96f else 0.90f).coerceAtMost(1f)'''
          new = '''            scaleX = (keyBoxScale * if (referenceWideKey) 0.98f else 0.94f).coerceAtMost(1.18f)
                      scaleY = (keyBoxScale * if (referenceLargeKey) 0.96f else 0.90f).coerceAtMost(1.22f)'''
          if old not in r:
              raise SystemExit('missing service key scale visual target')
          r = r.replace(old, new, 1)

          old = '''            setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      if (spec.label in setOf("q", "y", "p", "g", "j")) {'''
          new = '''            setTextColor(if (spec.label.isNotBlank() && spec.label.all { it.isDigit() }) keyNumberColor else keyTextColor)
                      gravity = Gravity.CENTER
                      if (spec.label in setOf("q", "y", "p", "g", "j")) {'''
          if old not in r:
              raise SystemExit('missing key legend color target')
          r = r.replace(old, new, 1)

          for old_call, new_call in [
              ('referenceBubbleKeyBackground(pressed = false)', 'referenceBubbleKeyBackground(pressed = false, baseColor = normalColor)'),
              ('referenceBubbleKeyBackground(pressed = true)', 'referenceBubbleKeyBackground(pressed = true, baseColor = normalColor)'),
          ]:
              if old_call not in r:
                  raise SystemExit(f'missing key background call target: {old_call}')
              r = r.replace(old_call, new_call)

          pattern = re.compile(r'''    private fun referenceBubbleKeyBackground\(pressed: Boolean\): GradientDrawable \{.*?\n    \}\n\n    private fun''', re.S)
          replacement = '''    private fun referenceBubbleKeyBackground(pressed: Boolean, baseColor: Int): GradientDrawable {
                  val face = if (pressed) pressedKeyBg else baseColor
                  val colors = intArrayOf(
                      mixColor(face, Color.WHITE, if (pressed) 0.16f else 0.10f),
                      face,
                      mixColor(face, Color.BLACK, 0.34f)
                  )
                  return GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, colors).apply {
                      cornerRadius = dpFloat(11f)
                      setStroke(dp(if (pressed) 3 else 2), keyBorderColor)
                  }
              }

              private fun mixColor(first: Int, second: Int, secondRatio: Float): Int {
                  val ratio = secondRatio.coerceIn(0f, 1f)
                  val inverse = 1f - ratio
                  return Color.rgb(
                      (Color.red(first) * inverse + Color.red(second) * ratio).toInt(),
                      (Color.green(first) * inverse + Color.green(second) * ratio).toInt(),
                      (Color.blue(first) * inverse + Color.blue(second) * ratio).toInt()
                  )
              }

              private fun'''
          r, count = pattern.subn(replacement, r, count=1)
          if count != 1:
              raise SystemExit(f'referenceBubbleKeyBackground patch count={count}')

          r = r.replace('if (pressed) Color.rgb(205, 124, 255) else Color.rgb(181, 86, 249)', 'keyBorderColor')
          service.write_text(r)

          picker = Path('app/src/main/java/com/riyan/aikeyboard/ManualColorPickerDialog.kt')
          picker.write_text(r'''package com.riyan.aikeyboard

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.PopupWindow
          import android.widget.TextView
          import kotlin.math.roundToInt

          object ManualColorPickerDialog {
              fun show(anchor: View, title: String, initialColor: Int, onSelected: (Int) -> Unit) {
                  val context = anchor.context
                  val hsv = FloatArray(3)
                  Color.colorToHSV(initialColor, hsv)
                  var hue = hsv[0]
                  var saturation = hsv[1]
                  var value = hsv[2]

                  val root = LinearLayout(context).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(context, 18), dp(context, 14), dp(context, 18), dp(context, 16))
                      background = rounded(Color.rgb(31, 31, 33), 24f, Color.rgb(56, 56, 60), 1, context)
                  }

                  lateinit var popup: PopupWindow
                  val header = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  header.addView(TextView(context).apply {
                      text = title
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(typeface, android.graphics.Typeface.BOLD)
                  }, LinearLayout.LayoutParams(0, dp(context, 48), 1f))
                  header.addView(TextView(context).apply {
                      text = "×"
                      textSize = 38f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setOnClickListener { if (::popup.isInitialized) popup.dismiss() }
                  }, LinearLayout.LayoutParams(dp(context, 52), dp(context, 48)))
                  root.addView(header)

                  val hueBar = HueBarView(context).apply { currentHue = hue }
                  root.addView(hueBar, LinearLayout.LayoutParams(-1, dp(context, 42)).apply {
                      topMargin = dp(context, 12)
                      bottomMargin = dp(context, 12)
                  })

                  val sv = SaturationValueView(context).apply {
                      currentHue = hue
                      currentSaturation = saturation
                      currentValue = value
                  }
                  root.addView(sv, LinearLayout.LayoutParams(-1, dp(context, 220)))

                  val previewRow = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(context, 12), 0, dp(context, 8))
                  }
                  val swatch = View(context)
                  previewRow.addView(swatch, LinearLayout.LayoutParams(dp(context, 40), dp(context, 40)).apply {
                      rightMargin = dp(context, 10)
                  })
                  val hexText = TextView(context).apply {
                      textSize = 14f
                      setTextColor(Color.WHITE)
                  }
                  previewRow.addView(hexText, LinearLayout.LayoutParams(0, dp(context, 40), 1f))
                  root.addView(previewRow)

                  fun currentColor(): Int = Color.HSVToColor(floatArrayOf(hue, saturation, value))
                  fun refreshPreview() {
                      val color = currentColor()
                      swatch.background = rounded(color, 8f, Color.WHITE, 1, context)
                      hexText.text = String.format("#%06X", 0xFFFFFF and color)
                  }
                  refreshPreview()

                  hueBar.onHueChanged = { selectedHue ->
                      hue = selectedHue
                      sv.currentHue = selectedHue
                      sv.invalidate()
                      refreshPreview()
                  }
                  sv.onChanged = { selectedSaturation, selectedValue ->
                      saturation = selectedSaturation
                      value = selectedValue
                      refreshPreview()
                  }

                  val actions = LinearLayout(context).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END or Gravity.CENTER_VERTICAL
                  }
                  actions.addView(TextView(context).apply {
                      text = "Batal"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      background = rounded(Color.rgb(55, 54, 60), 10f, Color.rgb(78, 76, 86), 1, context)
                      setOnClickListener { if (::popup.isInitialized) popup.dismiss() }
                  }, LinearLayout.LayoutParams(dp(context, 92), dp(context, 44)).apply { rightMargin = dp(context, 8) })
                  actions.addView(TextView(context).apply {
                      text = "Pilih Warna"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      background = rounded(Color.rgb(91, 68, 230), 10f, Color.rgb(125, 105, 255), 1, context)
                      setOnClickListener {
                          val selected = currentColor()
                          if (::popup.isInitialized) popup.dismiss()
                          onSelected(selected)
                      }
                  }, LinearLayout.LayoutParams(dp(context, 130), dp(context, 44)))
                  root.addView(actions)

                  val screenWidth = anchor.resources.displayMetrics.widthPixels
                  val popupWidth = minOf(screenWidth - dp(context, 28), dp(context, 430))
                  popup = PopupWindow(root, popupWidth, ViewGroup.LayoutParams.WRAP_CONTENT, true).apply {
                      isOutsideTouchable = true
                      setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                      elevation = dp(context, 16).toFloat()
                  }
                  popup.showAtLocation(anchor, Gravity.CENTER, 0, 0)
              }

              private class HueBarView(context: Context) : View(context) {
                  var currentHue = 0f
                      set(value) { field = value.coerceIn(0f, 359.99f); invalidate() }
                  var onHueChanged: ((Float) -> Unit)? = null
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(context, 4).toFloat()
                      color = Color.WHITE
                  }
                  private val shadow = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(context, 7).toFloat()
                      color = Color.BLACK
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      if (width <= 0 || height <= 0) return
                      paint.shader = LinearGradient(
                          0f, 0f, width.toFloat(), 0f,
                          intArrayOf(Color.RED, Color.YELLOW, Color.GREEN, Color.CYAN, Color.BLUE, Color.MAGENTA, Color.RED),
                          null,
                          Shader.TileMode.CLAMP
                      )
                      val cy = height / 2f
                      val radius = height * 0.16f
                      canvas.drawRoundRect(0f, cy - radius, width.toFloat(), cy + radius, radius, radius, paint)
                      paint.shader = null
                      val x = (currentHue / 360f) * width
                      canvas.drawCircle(x, cy, height * 0.32f, shadow)
                      canvas.drawCircle(x, cy, height * 0.32f, ring)
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      if (event.action != MotionEvent.ACTION_DOWN && event.action != MotionEvent.ACTION_MOVE) return true
                      val selected = ((event.x.coerceIn(0f, width.toFloat()) / width.coerceAtLeast(1)) * 359.99f)
                      currentHue = selected
                      onHueChanged?.invoke(selected)
                      return true
                  }
              }

              private class SaturationValueView(context: Context) : View(context) {
                  var currentHue = 0f
                  var currentSaturation = 1f
                  var currentValue = 1f
                  var onChanged: ((Float, Float) -> Unit)? = null
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val markerOuter = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(context, 6).toFloat()
                      color = Color.BLACK
                  }
                  private val markerInner = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = dp(context, 4).toFloat()
                      color = Color.WHITE
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      if (width <= 0 || height <= 0) return
                      val hueColor = Color.HSVToColor(floatArrayOf(currentHue, 1f, 1f))
                      paint.shader = LinearGradient(0f, 0f, width.toFloat(), 0f, Color.WHITE, hueColor, Shader.TileMode.CLAMP)
                      canvas.drawRoundRect(0f, 0f, width.toFloat(), height.toFloat(), dp(context, 12).toFloat(), dp(context, 12).toFloat(), paint)
                      paint.shader = LinearGradient(0f, 0f, 0f, height.toFloat(), Color.TRANSPARENT, Color.BLACK, Shader.TileMode.CLAMP)
                      canvas.drawRoundRect(0f, 0f, width.toFloat(), height.toFloat(), dp(context, 12).toFloat(), dp(context, 12).toFloat(), paint)
                      paint.shader = null
                      val x = currentSaturation.coerceIn(0f, 1f) * width
                      val y = (1f - currentValue.coerceIn(0f, 1f)) * height
                      canvas.drawCircle(x, y, dp(context, 12).toFloat(), markerOuter)
                      canvas.drawCircle(x, y, dp(context, 12).toFloat(), markerInner)
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      if (event.action != MotionEvent.ACTION_DOWN && event.action != MotionEvent.ACTION_MOVE) return true
                      currentSaturation = (event.x / width.coerceAtLeast(1)).coerceIn(0f, 1f)
                      currentValue = (1f - event.y / height.coerceAtLeast(1)).coerceIn(0f, 1f)
                      invalidate()
                      onChanged?.invoke(currentSaturation, currentValue)
                      return true
                  }
              }

              private fun rounded(fill: Int, radiusDp: Float, stroke: Int, strokeDp: Int, context: Context) = GradientDrawable().apply {
                  setColor(fill)
                  cornerRadius = radiusDp * context.resources.displayMetrics.density
                  setStroke(dp(context, strokeDp), stroke)
              }

              private fun dp(context: Context, value: Int): Int =
                  (value * context.resources.displayMetrics.density).roundToInt()
          }
          ''')

          Path('app/build-version.txt').write_text('0.21.16-test-custom-key-colors-150')
          Path('app/build-code.txt').write_text('37')
