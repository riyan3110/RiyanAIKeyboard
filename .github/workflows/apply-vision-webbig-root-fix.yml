name: Apply Vision WebBig Root Fix

on:
  push:
    branches:
      - fix/scanner-zoom-visual-gallery-v1
    paths:
      - tools/apply_vision_webbig_root_fix.py
      - .github/workflows/apply-vision-webbig-root-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-zoom-visual-gallery-v1
      - name: Apply root refactor
        run: python3 tools/apply_vision_webbig_root_fix.py
      - name: Commit real source changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt \
                  app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          git commit -m "Refactor visual recognition and restore Web Big"
          git push origin HEAD:fix/scanner-zoom-visual-gallery-v1
