name: Run Web Big Source Updater

on:
  push:
    branches:
      - fix/web-big-camera-vision-detail
    paths:
      - .github/workflows/apply-web-big-camera-vision-detail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-big-camera-vision-detail
      - run: python3 tools/apply_web_big_camera_vision.py
      - run: |
          rm -f tools/apply_web_big_camera_vision.py
          rm -f .github/workflows/apply-web-big-camera-vision-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Web Big camera and improve detailed human visual search"
          git push origin HEAD:fix/web-big-camera-vision-detail
