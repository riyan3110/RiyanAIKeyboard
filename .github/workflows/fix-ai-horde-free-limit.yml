name: Fix AI Horde free limit

on:
  push:
    branches:
      - fix/short-vision-query-search-engine-natural-adult
    paths:
      - .github/workflows/fix-ai-horde-free-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/short-vision-query-search-engine-natural-adult
          fetch-depth: 0
      - name: Cap AI Horde free output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/riyan/aikeyboard/AiClient.kt')
          s = p.read_text()
          old = '.put("max_length", maxTokens.coerceIn(64, 1024))'
          new = '.put("max_length", maxTokens.coerceIn(64, 480))'
          if old not in s:
              if new in s:
                  print('Already patched')
                  raise SystemExit(0)
              raise SystemExit('AI Horde max_length anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt
          git commit -m "Keep AI Horde requests within free zero-kudos limit"
          git push origin HEAD:fix/short-vision-query-search-engine-natural-adult
