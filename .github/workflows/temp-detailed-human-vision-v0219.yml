name: Temp detailed human vision v0.21.9

on:
  push:
    branches: [ fix/vision-query-pan-zoom ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[human-vision-v0219]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-query-pan-zoom
          fetch-depth: 0
      - name: Apply detailed English human Vision patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ai_path = Path('app/src/main/java/com/riyan/aikeyboard/AiClient.kt')
          ai = ai_path.read_text()

          # All native Vision providers receive the same OCR hint.
          ai = ai.replace('requestOpenRouterVision(settings, jpegBase64, "")', 'requestOpenRouterVision(settings, jpegBase64, localTextHint)')
          ai = ai.replace('requestTabiAiVision(settings, jpegBase64, "")', 'requestTabiAiVision(settings, jpegBase64, localTextHint)')
          ai = ai.replace('request9RouterVision(settings, jpegBase64, "")', 'request9RouterVision(settings, jpegBase64, localTextHint)')

          old_rule = 'Buat query pencarian visual yang pendek, natural, dan faktual: bahasa Indonesia, 3–12 kata, maksimal sekitar 112 karakter. Query hanya boleh berisi subjek utama dan 2–3 ciri paling jelas yang benar-benar terlihat pada foto saat ini. '
          new_rule = ('Untuk subject_type person atau human_figure, field query WAJIB berupa detailed English visual-search prompt yang natural, spesifik, dan deskriptif: 8–28 kata, maksimal sekitar 240 karakter. '
                      'Untuk manusia yang jelas dewasa, gunakan adult woman atau adult man dan jelaskan sebanyak mungkin ciri visual yang benar-benar terlihat: front/rear/side view, pose, hair length/color/texture, outfit color/type/material/fabric/fit, neckline, straps/sleeves, accessories, serta scene/background utama. '
                      'Bila benar-benar terlihat pada orang dewasa, sertakan visible body silhouette details seperti bare shoulders, visible cleavage, defined waist, curvy hips, exposed thigh through a slit, atau long legs; istilah sexy atau glamorous hanya boleh dipakai bila styling jelas mendukungnya. '
                      'Gunakan kata detail pakaian seperti satin, silk, leather, denim, lace, bodycon, fitted, tight, slip dress, mini skirt, leggings, shorts, atau thigh-high slit hanya bila tampak pada gambar. '
                      'Jangan menebak anatomi di balik pakaian dan jangan mengarang bagian tubuh, ukuran, tindakan seksual, identitas, etnisitas, atau detail yang tidak terlihat. '
                      'Jika usia tidak jelas atau mungkin di bawah 18 tahun, gunakan deskripsi netral tanpa sexy/sexualized wording. '
                      'Untuk subject non-manusia, tetap gunakan query pendek dan faktual serta pertahankan merek/model/spesifikasi OCR bila benar-benar terbaca. Evidence harus berupa fakta visual konkret; untuk person/human_figure tulis evidence dalam bahasa Inggris. ')
          if old_rule in ai:
              ai = ai.replace(old_rule, new_rule)
          elif 'detailed English visual-search prompt' not in ai:
              raise SystemExit('Human vision instruction marker not found')

          old_norm = '        if (subject == "person") query = normalizePersonQueryLabel(query)'
          new_norm = '        if (subject == "person" || subject == "human_figure") query = query.replace(Regex("\\\\s+"), " ").trim()'
          if old_norm in ai:
              ai = ai.replace(old_norm, new_norm)
          elif new_norm not in ai:
              raise SystemExit('Person normalizer marker not found')

          ai = ai.replace('            "person" -> preferredPersonPrefix(query)', '            "person" -> ""')
          ai = ai.replace('            "human_figure" -> "figur manusia/humanoid"', '            "human_figure" -> ""')

          old_semantic = '        if (subject !in setOf("text", "scene") && semanticTokens.size < 2) return null'
          new_semantic = ('        if (subject in setOf("person", "human_figure") && semanticTokens.size < 6) return null\n'
                          '        if (subject !in setOf("text", "scene", "person", "human_figure") && semanticTokens.size < 2) return null')
          if old_semantic in ai:
              ai = ai.replace(old_semantic, new_semantic)
          elif 'semanticTokens.size < 6' not in ai:
              raise SystemExit('Semantic threshold marker not found')

          old_limits = '        val maxWords = if (subject == "person") 12 else 7\n        val maxChars = if (subject == "person") 112 else 64'
          new_limits = ('        val personLike = subject == "person" || subject == "human_figure"\n'
                        '        val maxWords = if (personLike) 28 else 9\n'
                        '        val maxChars = if (personLike) 240 else 96')
          if old_limits in ai:
              ai = ai.replace(old_limits, new_limits)
          elif 'val maxWords = if (personLike) 28 else 9' not in ai:
              raise SystemExit('Vision limit marker not found')

          ai_path.write_text(ai)

          horde_path = Path('app/src/main/java/com/riyan/aikeyboard/AiHordeAlchemyVision.kt')
          horde = horde_path.read_text()
          horde = horde.replace('buildPersonQuery(rawCaption, parsed.tags, ageUnclear)', 'buildPersonPromptEnglish(rawCaption, parsed.tags, ageUnclear)')

          if 'private fun buildPersonPromptEnglish(' not in horde:
              marker = '    private fun bestClothingDescription(caption: String, tags: List<String>): String {'
              if marker not in horde:
                  raise SystemExit('AI Horde clothing marker not found')
              helper = r'''    private fun buildPersonPromptEnglish(
        rawCaption: String,
        rawTags: List<Pair<String, Double>>,
        ageUnclear: Boolean
    ): String {
        val strongTags = rawTags.filter { it.second >= 0.18 }
        val source = (rawCaption + " " + strongTags.joinToString(" ") { it.first })
            .lowercase()
            .replace(Regex("\\s+"), " ")
            .trim()
        fun has(pattern: String): Boolean = Regex(pattern, RegexOption.IGNORE_CASE).containsMatchIn(source)

        val adultWoman = !ageUnclear && has("\\b(adult woman|woman|women|female)\\b")
        val adultMan = !ageUnclear && !adultWoman && has("\\b(adult man|man|men|male)\\b")
        val subject = when {
            adultWoman -> "adult woman"
            adultMan -> "adult man"
            else -> "person"
        }

        val sexyStyling = !ageUnclear && (
            has("\\b(sexy|sensual|seductive)\\b") ||
                (has("\\b(satin|silk|bodycon|skin-tight|body-hugging|form-fitting|tight|fitted)\\b") &&
                    has("\\b(plunging|deep v|v-neck|cleavage|high slit|thigh slit|mini)\\b"))
            )
        val style = when {
            sexyStyling -> "sexy"
            !ageUnclear && has("\\b(glamorous|elegant|fashionable)\\b") -> "glamorous"
            else -> ""
        }

        val color = when {
            has("\\bblack\\b") -> "black"
            has("\\bwhite\\b") -> "white"
            has("\\bred\\b") -> "red"
            has("\\bblue\\b") -> "blue"
            has("\\bgreen\\b") -> "green"
            has("\\bgray|grey\\b") -> "gray"
            has("\\bbeige|cream\\b") -> "beige"
            has("\\bpink\\b") -> "pink"
            has("\\bpurple\\b") -> "purple"
            else -> ""
        }
        val material = when {
            has("\\bsatin\\b") -> "satin"
            has("\\bsilk\\b") -> "silk"
            has("\\bleather\\b") -> "leather"
            has("\\bdenim\\b") -> "denim"
            has("\\blace\\b") -> "lace"
            has("\\bknit|knitted\\b") -> "knit"
            has("\\bcotton\\b") -> "cotton"
            else -> ""
        }
        val fit = when {
            has("\\b(bodycon|skin-tight|body-hugging|form-fitting|tight|fitted|close-fitting)\\b") -> "fitted"
            has("\\bloose|oversized\\b") -> "loose"
            else -> ""
        }
        val garment = when {
            has("\\b(slip dress|camisole dress)\\b") -> "slip dress"
            has("\\bbodycon dress\\b") -> "bodycon dress"
            has("\\b(dress|gown)\\b") -> "dress"
            has("\\b(mini skirt|miniskirt)\\b") -> "mini skirt"
            has("\\bskirt\\b") -> "skirt"
            has("\\b(leggings|yoga pants)\\b") -> "leggings"
            has("\\b(shorts|athletic shorts|gym shorts)\\b") -> "shorts"
            has("\\bbikini\\b") -> "bikini"
            has("\\b(swimsuit|one-piece swimsuit)\\b") -> "swimsuit"
            has("\\b(top|blouse|shirt)\\b") -> "top"
            else -> ""
        }

        val clothingBits = linkedSetOf<String>()
        if (fit.isNotBlank()) clothingBits += fit
        if (color.isNotBlank()) clothingBits += color
        if (material.isNotBlank()) clothingBits += material
        if (garment.isNotBlank()) clothingBits += garment
        val clothing = clothingBits.joinToString(" ")
        val clothingPhrase = when {
            clothing.isBlank() -> ""
            garment == "leggings" || garment == "shorts" -> "wearing $clothing"
            else -> "wearing a $clothing"
        }

        val visibleDetails = mutableListOf<String>()
        if (!ageUnclear && has("\\b(cleavage|decolletage)\\b")) visibleDetails += "visible cleavage"
        if (!ageUnclear && has("\\b(bare shoulders|off shoulder|off-shoulder|spaghetti straps|thin straps|strapless)\\b")) visibleDetails += "bare shoulders"
        if (!ageUnclear && has("\\b(hourglass|defined waist|narrow waist)\\b")) visibleDetails += "defined waist"
        if (!ageUnclear && has("\\b(curvy|curvy hips|wide hips|hourglass)\\b")) visibleDetails += "curvy hips"
        if (!ageUnclear && has("\\b(thigh-high slit|thigh high slit|high slit|leg slit|exposed thigh)\\b")) visibleDetails += "exposed thigh through a high slit"
        if (has("\\b(plunging neckline|deep v-neck|deep v neck|v-neckline)\\b")) visibleDetails += "deep V-neckline"
        if (has("\\b(spaghetti straps|thin straps)\\b")) visibleDetails += "thin shoulder straps"

        val hairLength = when {
            has("\\blong hair\\b") -> "long"
            has("\\bshort hair\\b") -> "short"
            has("\\bmedium hair|shoulder-length hair\\b") -> "shoulder-length"
            else -> ""
        }
        val hairColor = when {
            has("\\bblack hair\\b") -> "black"
            has("\\bdark brown hair|brown hair\\b") -> "dark brown"
            has("\\bblonde hair|blond hair\\b") -> "blonde"
            has("\\bred hair\\b") -> "red"
            else -> ""
        }
        val hairTexture = when {
            has("\\bwavy hair\\b") -> "wavy"
            has("\\bcurly hair\\b") -> "curly"
            has("\\bstraight hair\\b") -> "straight"
            else -> ""
        }
        val hair = listOf(hairLength, hairColor, hairTexture)
            .filter { it.isNotBlank() }
            .distinct()
            .joinToString(" ")
            .let { if (it.isBlank()) "" else "$it hair" }

        val view = when {
            has("\\b(from behind|seen from behind|back view|rear view|facing away|back to camera)\\b") -> "rear view"
            has("\\b(side view|from the side|profile view)\\b") -> "side view"
            has("\\b(front view|from the front|facing camera|looking at camera)\\b") -> "front view"
            else -> ""
        }
        val pose = when {
            has("\\bwalking|walks\\b") -> "walking"
            has("\\bsitting|seated\\b") -> "sitting"
            has("\\bstanding|stands\\b") -> "standing"
            else -> ""
        }
        val scene = when {
            has("\\b(art gallery|gallery|museum|art exhibition)\\b") -> "in an art gallery"
            has("\\bstreet|city street\\b") -> "on a street"
            has("\\boutdoors|outdoor|park|garden\\b") -> "outdoors"
            has("\\bbedroom\\b") -> "in a bedroom"
            has("\\bliving room\\b") -> "in a living room"
            else -> ""
        }

        return buildList {
            add(subject)
            if (style.isNotBlank()) add(style)
            if (clothingPhrase.isNotBlank()) add(clothingPhrase)
            addAll(visibleDetails.distinct())
            if (hair.isNotBlank()) add(hair)
            if (view.isNotBlank()) add(view)
            if (pose.isNotBlank()) add(pose)
            if (scene.isNotBlank()) add(scene)
        }
            .filter { it.isNotBlank() }
            .joinToString(", ")
            .replace(Regex("\\s+"), " ")
            .take(240)
            .trim(' ', ',')
    }

'''
              horde = horde.replace(marker, helper + marker, 1)
          }
          horde_path.write_text(horde)

          smart_path = Path('app/smart-vision.gradle.kts')
          smart = smart_path.read_text().replace('AI Ads Keyboard · v0.21.8 test', 'AI Ads Keyboard · v0.21.9 test')
          smart_path.write_text(smart)

          gradle_path = Path('app/build.gradle.kts')
          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode = 29', 'versionCode = 30')
          gradle = gradle.replace('versionName = "0.21.8-test-smart-product-vision"', 'versionName = "0.21.9-test-detailed-human-vision"')
          gradle_path.write_text(gradle)
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/temp-detailed-human-vision-v0219.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt \
                  app/src/main/java/com/riyan/aikeyboard/AiHordeAlchemyVision.kt \
                  app/smart-vision.gradle.kts \
                  app/build.gradle.kts \
                  .github/workflows/temp-detailed-human-vision-v0219.yml
          git commit -m "fix: detailed English human vision prompts [human-vision-v0219]"
          git push origin HEAD:fix/vision-query-pan-zoom
