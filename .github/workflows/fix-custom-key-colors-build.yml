name: Fix custom color build compatibility

on:
  push:
    branches: [ feat/custom-key-colors-150 ]
    paths:
      - .github/workflows/fix-custom-key-colors-build.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-key-colors-150
          fetch-depth: 0
      - name: Apply compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          picker = Path('app/src/main/java/com/riyan/aikeyboard/ManualColorPickerDialog.kt')
          p = picker.read_text()
          old = 'if (::popup.isInitialized) popup.dismiss()'
          if old in p:
              p = p.replace(old, 'popup.dismiss()')
          picker.write_text(p)

          patcher = Path('tools/apply_bluesminds_provider_patch.py')
          t = patcher.read_text()
          old_tail = '''text = patch_key_view(text)
          text = patch_neon_key_border(text)
          text = patch_cursor_keys(text)
          KEYBOARD_SERVICE.write_text(text)

          print("Keyboard thinner neon border + restored direct touch patch applied")'''
          new_tail = '''if "keyBorderColor = palette.border" in text and "referenceBubbleKeyBackground(pressed: Boolean, baseColor: Int)" in text:
              print("Custom key color source detected; legacy keyboard visual patch skipped")
          else:
              text = patch_key_view(text)
              text = patch_neon_key_border(text)
              text = patch_cursor_keys(text)
              KEYBOARD_SERVICE.write_text(text)
              print("Keyboard thinner neon border + restored direct touch patch applied")'''
          if old_tail not in t:
              raise SystemExit('legacy visual patch tail not found')
          patcher.write_text(t.replace(old_tail, new_tail, 1))
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/ManualColorPickerDialog.kt tools/apply_bluesminds_provider_patch.py
          git commit -m "fix: keep custom key colors compatible with build patches"
          git push origin HEAD:feat/custom-key-colors-150
