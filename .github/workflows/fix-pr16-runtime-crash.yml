name: Fix PR16 runtime crash

on:
  push:
    branches:
      - ui/keyboard-reference-v2
    paths:
      - .github/workflows/fix-pr16-runtime-crash.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/keyboard-reference-v2

      - name: Apply runtime fix
        run: python3 tools/fix_pr16_runtime.py

      - name: Commit runtime fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-pr16-runtime-crash.yml tools/fix_pr16_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix keyboard runtime crash from utility bar wrapper"
          git push origin HEAD:ui/keyboard-reference-v2
