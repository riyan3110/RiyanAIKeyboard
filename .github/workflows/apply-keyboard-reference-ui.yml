name: Apply Keyboard Reference UI

on:
  push:
    branches:
      - ui/keyboard-reference-v2
    paths:
      - .github/workflows/apply-keyboard-reference-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/keyboard-reference-v2

      - name: Apply reference UI source update
        run: python3 .github/scripts/apply_keyboard_reference_ui.py

      - name: Commit source update
        run: |
          rm -f .github/workflows/apply-keyboard-reference-ui.yml
          rm -f .github/scripts/apply_keyboard_reference_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restyle keyboard keys and toolbar from reference"
          git push origin HEAD:ui/keyboard-reference-v2
