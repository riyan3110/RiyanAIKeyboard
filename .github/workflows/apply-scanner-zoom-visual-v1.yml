name: Apply Scanner Zoom Visual V1

on:
  push:
    branches:
      - fix/scanner-zoom-visual-gallery-v1
    paths:
      - tools/cleanup_scanner_zoom_visual_v1.py
      - .github/workflows/apply-scanner-zoom-visual-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-zoom-visual-gallery-v1
      - name: Clean final scanner source
        run: python3 tools/cleanup_scanner_zoom_visual_v1.py
      - name: Commit cleaned source
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          git commit -m "Finalize scanner zoom and visual search source"
          git push origin HEAD:fix/scanner-zoom-visual-gallery-v1
