name: Apply Bing web camera/gallery root fix

on:
  push:
    branches: [ fix/scanner-zoom-visual-gallery-v1 ]
    paths:
      - '.github/workflows/apply-bing-web-root-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-zoom-visual-gallery-v1
      - name: Restore original web size and repair Bing camera/gallery
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/bing_root_fix.py
          python3 /tmp/bing_root_fix.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt app/src/main/java/com/riyan/aikeyboard/WebImagePickerActivity.kt app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: restore Bing web size and camera gallery bridge"
          git push origin HEAD:fix/scanner-zoom-visual-gallery-v1
