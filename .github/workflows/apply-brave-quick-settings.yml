name: Apply Brave Quick Settings

on:
  push:
    branches:
      - fix/brave-quick-settings-functional-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source migration
        run: python tools/apply_brave_quick_settings.py
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/BraveBrowserPanel.kt
          git commit -m "fix: make Brave quick settings functional"
          git push
