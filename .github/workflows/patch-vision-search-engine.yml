name: Patch vision query and search engine

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/short-vision-query-search-engine-natural-adult' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          s = service.read_text()

          new_clean = '''    private fun cleanAiVisionSearchQuery(raw: String): String {
              val line = raw.lineSequence()
                  .map { it.trim().trim('"', '\\'', '`') }
                  .firstOrNull { it.isNotBlank() }
                  .orEmpty()
              val cleaned = line
                  .replace(Regex("(?i)^(?:query|search query|pencarian|hasil)\\\\s*:\\\\s*"), "")
                  .replace(Regex("\\\\s+"), " ")
                  .trim()
              val filler = setOf("the", "a", "an", "and", "in", "with", "setting", "of", "at", "on", "yang", "sedang", "terlihat")
              return cleaned.split(Regex("\\\\s+"))
                  .filter { it.isNotBlank() && it.lowercase() !in filler }
                  .take(7)
                  .joinToString(" ")
                  .take(64)
                  .trim()
          }
          '''
          pattern = r'    private fun cleanAiVisionSearchQuery\(raw: String\): String \{.*?\n    \}\n\n    private fun aiVisionFailureMessage'
          s, n = re.subn(pattern, new_clean + '\n    private fun aiVisionFailureMessage', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'cleanAiVisionSearchQuery replacement count={n}')

          s, n = re.subn(
              r'searchUrl = directUrl\.takeIf\(::isWebUrl\) \?: if \(isWebUrl\(cleanQuery\)\) cleanQuery else braveSearchUrl\(cleanQuery\)',
              'searchUrl = directUrl.takeIf(::isWebUrl) ?: if (isWebUrl(cleanQuery)) cleanQuery else selectedWebSearchUrl(cleanQuery)',
              s, count=1
          )
          if n != 1:
              raise SystemExit(f'openSearchResults replacement count={n}')

          s, n = re.subn(
              r'searchUrl = if \(isWebUrl\(query\)\) query else braveSearchUrl\(query\)',
              'searchUrl = if (isWebUrl(query)) query else selectedWebSearchUrl(query)',
              s, count=1
          )
          if n != 1:
              raise SystemExit(f'performSearchFromInput replacement count={n}')

          old_images = 'searchUrl = "https://search.brave.com/images?q=${Uri.encode(query)}&source=web"'
          if s.count(old_images) != 2:
              raise SystemExit(f'expected 2 camera/gallery Brave image assignments, found {s.count(old_images)}')
          s = s.replace(old_images, 'searchUrl = selectedImageSearchUrl(query)')

          old_open_image = 'searchUrl = "https://search.brave.com/images?q=${Uri.encode(clean)}&source=web"'
          if old_open_image not in s:
              raise SystemExit('openBraveImageResults assignment not found')
          s = s.replace(old_open_image, 'searchUrl = selectedImageSearchUrl(clean)', 1)

          marker = '    private fun braveSearchUrl(query: String): String = Uri.Builder()\n'
          helpers = '''    private fun selectedSearchEngineId(): String =
              getSharedPreferences(PREFS, MODE_PRIVATE).getString("browser_search_engine", "brave") ?: "brave"

          private fun selectedWebSearchUrl(query: String): String {
              val encoded = Uri.encode(query.trim())
              return when (selectedSearchEngineId()) {
                  "google" -> "https://www.google.com/search?q=$encoded"
                  "bing" -> "https://www.bing.com/search?q=$encoded"
                  "ddg" -> "https://duckduckgo.com/?q=$encoded"
                  else -> "https://search.brave.com/search?q=$encoded&source=web"
              }
          }

          private fun selectedImageSearchUrl(query: String): String {
              val encoded = Uri.encode(query.trim())
              return when (selectedSearchEngineId()) {
                  "google" -> "https://www.google.com/search?tbm=isch&q=$encoded"
                  "bing" -> "https://www.bing.com/images/search?q=$encoded"
                  "ddg" -> "https://duckduckgo.com/?q=$encoded&iax=images&ia=images"
                  else -> "https://search.brave.com/images?q=$encoded&source=web"
              }
          }

          '''
          if marker not in s:
              raise SystemExit('braveSearchUrl marker not found')
          s = s.replace(marker, helpers + marker, 1)
          service.write_text(s)

          client = Path('app/src/main/java/com/riyan/aikeyboard/AiClient.kt')
          a = client.read_text()

          old_chat = 'Untuk konteks orang dewasa (18+), gunakan istilah anatomi dan seksual yang lugas bila memang relevan—misalnya payudara, puting, vulva, vagina, penis, skrotum, bokong, dan anus—tanpa eufemisme yang tidak perlu. Bila membicarakan seseorang yang jelas wanita dewasa, sebut wanita secara natural, bukan orang/manusia wanita; untuk pria gunakan pria. Jangan mencoba mengidentifikasi orang nyata, dan jangan membuat deskripsi seksual tentang anak atau orang yang usianya tidak jelas.'
          new_chat = 'Untuk konteks dewasa (18+), gunakan bahasa yang natural dan tidak terasa seperti teks klinis atau template. Pahami kosakata sehari-hari dan slang dewasa sesuai bahasa pengguna; misalnya bokong, payudara besar, pinggul, rok mini, rok ketat, legging ketat, celana pendek ketat, baju ketat, rok satin ketat, serta pahami memek sebagai slang vulva dan itil sebagai slang klitoris. Jika pengguna memakai istilah seksual eksplisit, pahami maknanya dan pertahankan ragam bahasa yang sesuai konteks tanpa otomatis mengubahnya menjadi istilah kaku. Bila membicarakan seseorang yang jelas wanita dewasa, sebut wanita secara natural, bukan orang/manusia wanita; untuk pria gunakan pria. Jangan mencoba mengidentifikasi orang nyata, jangan mengarang tindakan seksual dari pose atau ekspresi, dan jangan membuat deskripsi seksual tentang anak atau orang yang usianya tidak jelas.'
          if old_chat not in a:
              raise SystemExit('chat adult instruction not found')
          a = a.replace(old_chat, new_chat, 1)

          replacements = [
              ('(wanita|perempuan)\\\\b"), "wanita")', '(wanita|perempuan|woman|women|female)\\\\b"), "wanita")'),
              ('(pria|laki-laki|lelaki)\\\\b"), "pria")', '(pria|laki-laki|lelaki|man|men|male)\\\\b"), "pria")'),
              ('^\\\\s*perempuan\\\\b"), "wanita")', '^\\\\s*(perempuan|woman|women|female)\\\\b"), "wanita")'),
              ('^\\\\s*(laki-laki|lelaki)\\\\b"), "pria")', '^\\\\s*(laki-laki|lelaki|man|men|male)\\\\b"), "pria")'),
          ]
          for old, new in replacements:
              if old not in a:
                  raise SystemExit(f'person normalization token not found: {old}')
              a = a.replace(old, new, 1)

          old_vision = 'Setelah jenis subjek benar, tulis query pencarian visual yang menyebut bentuk/subjek dulu, lalu detail pembeda seperti pose, bagian tubuh/objek, warna, pola, pakaian, logo, tulisan yang benar-benar terbaca, bahan, tekstur, dan konteks. '
          new_vision = 'Setelah jenis subjek benar, buat query pencarian visual yang SANGAT PENDEK dan natural: bahasa Indonesia, 3–7 kata, maksimal sekitar 60 karakter, tanpa kalimat penjelasan atau gaya prompt. Sebut subjek utama lalu paling banyak 2–3 ciri visual yang paling membedakan. Hindari filler seperti setting, with, arms, terlihat, sedang, atau detail latar yang tidak penting. Untuk subjek dewasa, pahami deskripsi tubuh dan pakaian secara natural, termasuk bokong, payudara besar, pinggul, rok mini, rok ketat, legging ketat, celana pendek ketat, baju ketat, rok satin ketat; pahami memek sebagai slang vulva dan itil sebagai slang klitoris. Gunakan hanya ciri yang benar-benar terlihat dan jangan mengarang tindakan seksual dari pose atau ekspresi. '
          if old_vision not in a:
              raise SystemExit('vision query instruction not found')
          a = a.replace(old_vision, new_vision, 1)

          old_return = '        return query.take(280)\n'
          new_return = '''        return query.split(Regex("\\\\s+"))
              .filter { it.isNotBlank() }
              .take(7)
              .joinToString(" ")
              .take(64)
              .trim()
          '''
          if old_return not in a:
              raise SystemExit('vision return cap not found')
          a = a.replace(old_return, new_return, 1)
          client.write_text(a)
          PY

          rm -f .github/workflows/patch-vision-search-engine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt app/src/main/java/com/riyan/aikeyboard/AiClient.kt .github/workflows/patch-vision-search-engine.yml
          git commit -m "fix: shorten vision search and honor selected engine"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
