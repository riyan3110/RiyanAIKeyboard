name: Apply AI Vision Source Update

on:
  push:
    branches: [ rebuild/internal-gallery-v2 ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/internal-gallery-v2
      - name: Update AI Vision source
        run: python3 tools/apply_ai_vision_unfiltered.py
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "AI Vision source already updated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/AiClient.kt app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          git commit -m "Remove app-side AI Vision filtering and use full-frame detection"
          git push origin HEAD:rebuild/internal-gallery-v2
