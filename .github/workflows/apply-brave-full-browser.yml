name: Apply Brave Full Browser

on:
  push:
    branches: [ feat/brave-search-latest ]
    paths:
      - tools/apply_brave_full_browser.py
      - .github/workflows/apply-brave-full-browser.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brave-search-latest
          fetch-depth: 0
      - name: Apply browser integration
        run: python tools/apply_brave_full_browser.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt app/src/main/java/com/riyan/aikeyboard/BraveBrowserPanel.kt
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate complete Brave-style browser panel"
          git push origin HEAD:feat/brave-search-latest
