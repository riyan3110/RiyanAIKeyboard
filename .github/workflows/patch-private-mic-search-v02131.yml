name: Patch PRIVATE mic search v0.21.31

on:
  push:
    branches:
      - fix/private-mic-space-v030
    paths:
      - .github/workflows/patch-private-mic-search-v02131.yml

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-mic-space-v030
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch PRIVATE mic-only Search mode
        run: python3 tools/patch_private_mic_search_v02131.py

      - name: Verify PRIVATE Search isolation
        shell: bash
        run: |
          grep -n "private var voiceModeActive = false" app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          grep -n "performVoiceSearchOnly" app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          grep -n "searchGeneration != scannerSearchGeneration" app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          cp app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt /tmp/RiyanKeyboardService.kt
          cp app/build-version.txt /tmp/build-version.txt
          cp app/build-code.txt /tmp/build-code.txt

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.riyan-ai-keyboard/debug.keystore
          key: ${{ runner.os }}-riyan-ai-debug-keystore-v2

      - name: Create debug key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.riyan-ai-keyboard"
          if [ ! -f "$HOME/.riyan-ai-keyboard/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.riyan-ai-keyboard/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Riyan AI Keyboard Debug,O=Riyan,C=ID" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Apply persistent version
        shell: bash
        run: |
          VERSION_NAME=$(tr -d '\r\n' < app/build-version.txt)
          VERSION_CODE=$(tr -d '\r\n' < app/build-code.txt)
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          grep -E 'version(Code|Name)' app/build.gradle.kts

      - name: Install WebP conversion tool
        shell: bash
        run: |
          if ! command -v dwebp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends webp
          fi

      - name: Apply existing PRIVATE build patches
        shell: bash
        run: |
          python3 tools/apply_bluesminds_provider_patch.py
          python3 tools/apply_browser_chrome_patch.py
          python3 tools/apply_photo_colors_safe_scale_patch.py
          python3 tools/apply_bai_provider_patch.py
          python3 tools/apply_private_extra_providers_patch.py
          python3 tools/apply_private_reference_urls_patch.py
          python3 tools/apply_autocaps_brand_patch.py
          python3 tools/allow_brand_only_visible_label.py
          python3 tools/apply_private_haptic_shift_popup_gap_patch.py
          python3 tools/apply_private_tighter_gap_patch.py
          python3 tools/apply_private_ai_fresh_focus_shift_patch.py
          python3 tools/apply_private_touch_emoji_patch.py

      - name: Test and build PRIVATE APK
        run: RIYAN_KEYSTORE_PATH="$HOME/.riyan-ai-keyboard/debug.keystore" gradle :app:testDebugUnitTest :app:assembleDebug -x :app:patchBluesMindsProvider

      - name: Package PRIVATE APK
        id: package
        shell: bash
        run: |
          APK_NAME="AI-Ads-Keyboard-PRIVATE-0.21.31.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
          echo "apk_path=app/build/outputs/apk/debug/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit only PRIVATE mic Search changes
        shell: bash
        run: |
          git reset --hard HEAD
          cp /tmp/RiyanKeyboardService.kt app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt
          cp /tmp/build-version.txt app/build-version.txt
          cp /tmp/build-code.txt app/build-code.txt
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt app/build-version.txt app/build-code.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "PRIVATE 0.21.31: isolate mic Search from camera and gallery"
            git push origin HEAD:fix/private-mic-space-v030
          fi

      - name: Upload PRIVATE APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Ads-Keyboard-PRIVATE-0.21.31
          path: ${{ steps.package.outputs.apk_path }}
