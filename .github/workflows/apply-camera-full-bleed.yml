name: Apply camera full-bleed UI

on:
  push:
    branches: [ ui/camera-full-bleed ]
    paths: [ .github/workflows/apply-camera-full-bleed.yml ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/camera-full-bleed
      - name: Update camera panel only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          text = path.read_text()
          start = text.index('    private fun showEmbeddedCameraPanel(resetCandidate: Boolean) {')
          end = text.index('    private fun showInternalGalleryPanel()', start)
          block = text[start:end]
          original = block

          old = '''        val content = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              background = roundedBackground(Color.rgb(18, 18, 23), 20f)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) clipToOutline = true
          }
          '''
          new = '''        val content = FrameLayout(this).apply {
              background = roundedBackground(Color.TRANSPARENT, 20f)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) clipToOutline = true
          }
          '''
          if old not in block:
              raise SystemExit('camera content container pattern not found')
          block = block.replace(old, new, 1)

          old = '''        val header = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              setPadding(dp(7), dp(2), dp(4), dp(2))
              setBackgroundColor(Color.rgb(34, 33, 41))
          }
          '''
          new = '''        val header = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              setPadding(dp(7), dp(2), dp(4), dp(2))
              elevation = dpFloat(8f)
          }
          '''
          if old not in block:
              raise SystemExit('camera header pattern not found')
          block = block.replace(old, new, 1)

          pattern = re.compile(
              r'''        val title = TextView\(this\)\.apply \{.*?        header\.addView\(scannerStatusText, LinearLayout\.LayoutParams\(0, dp\(searchHeaderHeightDp\(\)\), 1f\)\)\n''',
              re.S,
          )
          block, count = pattern.subn(
              '''        scannerStatusText = TextView(this).apply {
              visibility = View.GONE
          }
          header.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
          ''',
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'camera title/status removal matched {count} times')

          old = '        content.addView(header, LinearLayout.LayoutParams(-1, dp(searchHeaderHeightDp() + 4)))\n'
          new = '''        content.addView(header, FrameLayout.LayoutParams(-1, dp(searchHeaderHeightDp() + 4), Gravity.TOP).apply {
              leftMargin = dp(3)
              rightMargin = dp(3)
              topMargin = dp(2)
          })
          '''
          if old not in block:
              raise SystemExit('camera header layout pattern not found')
          block = block.replace(old, new, 1)

          overlay = re.compile(
              r'''        previewFrame\.addView\(View\(this\)\.apply \{\n            background = GradientDrawable\(\)\.apply \{\n                setColor\(Color\.TRANSPARENT\)\n                cornerRadius = dpFloat\(18f\)\n                setStroke\(dp\(2\), Color\.WHITE\)\n            \}\n        \}, FrameLayout\.LayoutParams\(-1, if \(isLandscape\(\)\) dp\(72\) else dp\(140\), Gravity\.CENTER\)\.apply \{\n            setMargins\(dp\(28\), 0, dp\(28\), 0\)\n        \}\)\n'''
          )
          block, count = overlay.subn('', block, count=1)
          if count != 1:
              raise SystemExit(f'white scan box removal matched {count} times')

          old = '        content.addView(previewFrame, LinearLayout.LayoutParams(-1, 0, 1f))\n'
          new = '        content.addView(previewFrame, FrameLayout.LayoutParams(-1, -1))\n'
          if old not in block:
              raise SystemExit('camera preview layout pattern not found')
          block = block.replace(old, new, 1)

          old = '''        val resultCard = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              setPadding(dp(6), dp(3), dp(4), dp(3))
              setBackgroundColor(Color.rgb(31, 30, 38))
          }
          '''
          new = '''        val resultCard = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              setPadding(dp(6), dp(3), dp(4), dp(3))
              setBackgroundColor(Color.TRANSPARENT)
              elevation = dpFloat(8f)
          }
          '''
          if old not in block:
              raise SystemExit('camera result bar pattern not found')
          block = block.replace(old, new, 1)

          old = '        content.addView(resultCard, LinearLayout.LayoutParams(-1, if (isLandscape()) dp(40) else dp(55)))\n'
          new = '''        content.addView(resultCard, FrameLayout.LayoutParams(-1, if (isLandscape()) dp(40) else dp(55), Gravity.BOTTOM))
          header.bringToFront()
          resultCard.bringToFront()
          '''
          if old not in block:
              raise SystemExit('camera result layout pattern not found')
          block = block.replace(old, new, 1)

          if block == original:
              raise SystemExit('no camera UI changes applied')

          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY

          rm .github/workflows/apply-camera-full-bleed.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt .github/workflows/apply-camera-full-bleed.yml
          git commit -m "Make camera preview full-bleed inside purple frame"
          git push origin HEAD:ui/camera-full-bleed
