name: Apply gallery image picker patch

on:
  push:
    branches:
      - feature/gallery-image-picker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply gallery picker changes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_gallery.py
          python3 /tmp/patch_gallery.py

      - name: Verify gallery patch compiles
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-gallery-image-picker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt app/src/main/java/com/riyan/aikeyboard/GalleryPickerActivity.kt app/src/main/AndroidManifest.xml .github/workflows/patch-gallery-image-picker.yml
          git commit -m "feat: add gallery image mode to scanner"
          git push origin HEAD:feature/gallery-image-picker
