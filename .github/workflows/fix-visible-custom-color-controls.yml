name: Fix visible custom color controls

on:
  push:
    branches: [ feat/custom-key-colors-150 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-key-colors-150
      - name: Make color controls always visible and clarify 150 max
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt')
          s = p.read_text()

          old = '        if (draft.themeMode == KeyboardTheme.MODE_CUSTOM) {\n'
          new = '        run {\n'
          if old not in s:
              raise SystemExit('custom color visibility marker not found')
          s = s.replace(old, new, 1)

          replacements = [
              ('                    val hex = colorToHex(picked)\n                    draft.themeBorderColor = hex',
               '                    val hex = colorToHex(picked)\n                    draft.themeMode = KeyboardTheme.MODE_CUSTOM\n                    draft.themeBorderColor = hex'),
              ('                ManualColorPickerDialog.show(anchor, "Warna tombol", parseDraftColor(draft.themeKeyColor, Color.rgb(50, 50, 60))) { picked ->\n                    draft.themeKeyColor = colorToHex(picked)',
               '                ManualColorPickerDialog.show(anchor, "Warna tombol", parseDraftColor(draft.themeKeyColor, Color.rgb(50, 50, 60))) { picked ->\n                    draft.themeMode = KeyboardTheme.MODE_CUSTOM\n                    draft.themeKeyColor = colorToHex(picked)'),
              ('                ManualColorPickerDialog.show(anchor, "Warna huruf", parseDraftColor(draft.themeLetterColor, Color.WHITE)) { picked ->\n                    draft.themeLetterColor = colorToHex(picked)',
               '                ManualColorPickerDialog.show(anchor, "Warna huruf", parseDraftColor(draft.themeLetterColor, Color.WHITE)) { picked ->\n                    draft.themeMode = KeyboardTheme.MODE_CUSTOM\n                    draft.themeLetterColor = colorToHex(picked)'),
              ('                ManualColorPickerDialog.show(anchor, "Warna angka", parseDraftColor(draft.themeNumberColor, Color.WHITE)) { picked ->\n                    draft.themeNumberColor = colorToHex(picked)',
               '                ManualColorPickerDialog.show(anchor, "Warna angka", parseDraftColor(draft.themeNumberColor, Color.WHITE)) { picked ->\n                    draft.themeMode = KeyboardTheme.MODE_CUSTOM\n                    draft.themeNumberColor = colorToHex(picked)'),
              ('        keyCard.addView(sliderRow("Skala Kotak Tombol", 65, 150, draft.keyBoxScale, "%") { draft.keyBoxScale = it })',
               '        keyCard.addView(sliderRow("Skala Kotak Tombol (Maks. 150%)", 65, 150, draft.keyBoxScale, "%") { draft.keyBoxScale = it })'),
          ]
          for old_text, new_text in replacements:
              if old_text not in s:
                  raise SystemExit('expected marker missing: ' + old_text[:80])
              s = s.replace(old_text, new_text, 1)

          p.write_text(s)
          Path('app/build-version.txt').write_text('0.21.17-test-color-controls-visible-150')
          Path('app/build-code.txt').write_text('38')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt app/build-version.txt app/build-code.txt
          git commit -m 'fix: always show manual color controls and clarify 150 percent max'
          git push origin HEAD:feat/custom-key-colors-150