name: Fix Brave Full Browser Compile

on:
  push:
    branches: [ feat/brave-search-latest ]
    paths:
      - tools/fix_brave_full_browser_compile.py
      - .github/workflows/fix-brave-full-browser-compile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/brave-search-latest
          fetch-depth: 0
      - run: python tools/fix_brave_full_browser_compile.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/riyan/aikeyboard/BraveBrowserPanel.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: compile Brave-style browser panel"
          git push origin HEAD:feat/brave-search-latest
