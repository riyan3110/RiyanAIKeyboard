name: Fix modern icon build

on:
  push:
    branches:
      - chore/direct-photo-modern-icons

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/direct-photo-modern-icons
      - name: Fix ImageButton minimum size properties
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')
          s = p.read_text()
          old = '''        scaleType = ImageView.ScaleType.CENTER_INSIDE\n        minWidth = 0\n        minimumWidth = 0\n        minHeight = 0\n        minimumHeight = 0\n'''
          new = '''        scaleType = ImageView.ScaleType.CENTER_INSIDE\n        minimumWidth = 0\n        minimumHeight = 0\n'''
          if old not in s:
              raise SystemExit('Expected premiumIconButton block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-modern-icon-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compile modern ImageButton controls"
          git push origin HEAD:chore/direct-photo-modern-icons
