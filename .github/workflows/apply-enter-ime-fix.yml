name: Apply focused Enter IME fix

on:
  push:
    branches:
      - codex/enter-ime-action-v021

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/enter-ime-action-v021
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/apply_enter_ime_fix_once.py

      - name: Validate focused diff
        run: git diff --check

      - name: Commit source-only result
        run: |
          rm -f .github/workflows/apply-enter-ime-fix.yml
          rm -f tools/apply_enter_ime_fix_once.py
          git config user.name "Riyan3w"
          git config user.email "129081548+riyan3110@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync Enter key with active editor action"
          git push origin HEAD:codex/enter-ime-action-v021
