name: Apply Settings Overlay V2

on:
  push:
    branches:
      - ui/settings-overlay-v1
    paths:
      - .github/workflows/apply-settings-overlay-v2.yml
      - tools/apply_settings_overlay.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/settings-overlay-v1
      - name: Apply patch
        run: python3 tools/apply_settings_overlay.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-settings-overlay.yml
          rm -f .github/workflows/apply-settings-overlay-v2.yml
          rm -f tools/apply_settings_overlay.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Open settings inside keyboard overlay"
          git push origin HEAD:ui/settings-overlay-v1
