name: Fix photo colors and safe key scale

on:
  push:
    branches: [ feat/custom-key-colors-150 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/custom-key-colors-150

      - name: Apply requested fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          overlay = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt')
          theme = Path('app/src/main/java/com/riyan/aikeyboard/KeyboardTheme.kt')
          service = Path('app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt')

          s = overlay.read_text()
          old_mode = '                    draft.themeMode = KeyboardTheme.MODE_CUSTOM\n'
          new_mode = '                    if (draft.themeMode != KeyboardTheme.MODE_PHOTO) draft.themeMode = KeyboardTheme.MODE_CUSTOM\n'
          count = s.count(old_mode)
          if count < 4:
              raise SystemExit(f'expected at least 4 custom color mode assignments, found {count}')
          s = s.replace(old_mode, new_mode, 4)
          overlay.write_text(s)

          s = theme.read_text()
          old_photo = '''        if (usesPhoto) {
            return KeyboardThemePalette(
                background = Color.rgb(18, 18, 23),
                key = Color.argb(224, 45, 45, 54),
                specialKey = Color.argb(230, 35, 63, 75),
                pressedKey = Color.rgb(111, 83, 220),
                accent = Color.rgb(105, 76, 218),
                text = Color.WHITE,
                usesPhoto = true
            )
        }
'''
          new_photo = '''        if (usesPhoto) {
            return KeyboardThemePalette(
                background = Color.rgb(18, 18, 23),
                key = customKey,
                specialKey = customKey,
                pressedKey = blend(customKey, customBorder, 0.24f),
                accent = customBorder,
                text = customLetter,
                usesPhoto = true,
                border = customBorder,
                numberText = customNumber
            )
        }
'''
          if old_photo not in s:
              raise SystemExit('photo palette marker not found')
          s = s.replace(old_photo, new_photo, 1)
          theme.write_text(s)

          s = service.read_text()
          old_scale = '        keyBoxScale = prefs.getInt("key_box_scale_percent", 100).coerceIn(65, 150) / 100f\n'
          new_scale = '''        val keyScalePercent = prefs.getInt("key_box_scale_percent", 100).coerceIn(65, 150)
        keyBoxScale = if (keyScalePercent <= 100) {
            keyScalePercent / 100f
        } else {
            1f + ((keyScalePercent - 100) * 0.0025f)
        }
'''
          if old_scale not in s:
              raise SystemExit('key scale preference marker not found')
          s = s.replace(old_scale, new_scale, 1)

          old_comment = '''            // At the old 100% setting the regular caps now fill 90% of their cells instead of
            // only 78%. The new 110% maximum can reach 99%, while clamping prevents overlap.
'''
          new_comment = '''            // Keep 100% as the visual baseline. Above 100%, the preference is intentionally
            // softened so 120-150% grows gradually without keys colliding or breaking rows.
'''
          if old_comment in s:
              s = s.replace(old_comment, new_comment, 1)
          service.write_text(s)

          Path('app/build-version.txt').write_text('0.21.18-test-photo-colors-safe-scale')
          Path('app/build-code.txt').write_text('39')
          PY

      - name: Commit requested fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyan/aikeyboard/KeyboardSettingsOverlay.kt \
                  app/src/main/java/com/riyan/aikeyboard/KeyboardTheme.kt \
                  app/src/main/java/com/riyan/aikeyboard/RiyanKeyboardService.kt \
                  app/build-version.txt app/build-code.txt
          git rm .github/workflows/fix-photo-colors-safe-scale.yml
          git commit -m 'fix: apply custom colors on photo themes and soften key scale'
          git push origin HEAD:feat/custom-key-colors-150
